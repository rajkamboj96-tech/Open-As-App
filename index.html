, calcFn) {\n    document.querySelectorAll(`#${pageId} input[type=\"number\"]`).forEach(inp => inp.value = 0);\n    calcFn();\n  }\n\n  function num(id) {\n    return parseFloat(document.getElementById(id).value) || 0;\n  }\n\n  function fmt(v) {\n    if (!isFinite(v) || isNaN(v)) return '0';\n    return Number(v.toFixed(4)).toString();\n  }\n\n  function set(id, val) {\n    document.getElementById(id).textContent = fmt(val);\n  }\n\n  // 1. Square\n  function calcSquare() {\n    const a = num('sq-a');\n    set('sq-area', a * a);\n    set('sq-peri', 4 * a);\n  }\n\n  // 2. Rectangle\n  function calcRect() {\n    const l = num('rect-l'), w = num('rect-w');\n    set('rect-area', l * w);\n    set('rect-peri', 2 * (l + w));\n  }\n\n  // 3. Parallelogram\n  function calcPara() {\n    set('para-area', num('para-b') * num('para-h'));\n  }\n\n  // 4. Rhombus\n  function calcRhombus() {\n    set('rhom-area', 0.5 * num('rhom-d1') * num('rhom-d2'));\n  }\n\n  // 5. Triangle (Heron's)\n  function calcTri() {\n    const a = num('tri-a'), b = num('tri-b'), c = num('tri-c');\n    if (a <= 0 || b <= 0 || c <= 0) { set('tri-area', 0); return; }\n    if (a + b <= c || a + c <= b || b + c <= a) {\n      document.getElementById('tri-area').textContent = 'ਗਲਤ ਮਾਪ (ਤਿਕੋਣ ਨਹੀਂ ਬਣਦੀ)';\n      return;\n    }\n    const s = 0.5 * (a + b + c);\n    set('tri-area', Math.sqrt(s * (s - a) * (s - b) * (s - c)));\n  }\n\n  // 6. Right Triangle\n  function calcRTri() {\n    set('rtri-area', 0.5 * num('rtri-b') * num('rtri-h'));\n  }\n\n  // 7. Trapezoid\n  function calcTrap() {\n    set('trap-area', 0.5 * (num('trap-b1') + num('trap-b2')) * num('trap-h'));\n  }\n\n  // 8. Circle + Sector + Segment\n  function calcCircle() {\n    const r = num('cir-r');\n    set('cir-area', PI * r * r);\n    set('cir-circ', 2 * PI * r);\n\n    const sr = num('sec-r'), sa = num('sec-a');\n    set('sec-area', PI * sr * sr * (sa / 360));\n    set('sec-arc', 2 * PI * sr * (sa / 360));\n\n    const gr = num('seg-r'), ga = num('seg-a');\n    const rad = ga * PI / 180;\n    set('seg-area', (gr * gr / 2) * (rad - Math.sin(rad)));\n  }\n\n  // 9. Cube\n  function calcCube() {\n    const l = num('cube-l');\n    set('cube-tsa', 6 * l * l);\n    set('cube-vol', l * l * l);\n  }\n\n  // 10. Cuboid\n  function calcCuboid() {\n    const l = num('cub-l'), w = num('cub-w'), b = num('cub-b');\n    set('cub-sa', 2 * (l * w + w * b + b * l));\n    set('cub-vol', l * w * b);\n  }\n\n  // 11. Cylinder\n  function calcCyl() {\n    const r = num('cyl-r'), h = num('cyl-h');\n    set('cyl-vol', PI * r * r * h);\n    set('cyl-ssa', 2 * PI * r * h);\n    set('cyl-tsa', 2 * PI * r * (r + h));\n\n    const frv = num('cyl-fr-v'), frh = num('cyl-fr-h');\n    set('cyl-fr-res', (frv > 0 && frh > 0) ? Math.sqrt(frv / (PI * frh)) : 0);\n\n    const fhv = num('cyl-fh-v'), fhr = num('cyl-fh-r');\n    set('cyl-fh-res', (fhv > 0 && fhr > 0) ? fhv / (PI * fhr * fhr) : 0);\n\n    set('cyl-ca-res', 2 * PI * num('cyl-ca-r') * num('cyl-ca-h'));\n  }\n\n  // 12. Pyramid\n  function calcPyr() {\n    set('pyr-vol', (num('pyr-l') * num('pyr-w') * num('pyr-h')) / 3);\n  }\n\n  // 13. Cone + Frustum + Find H/R\n  function calcCone() {\n    const r = num('cone-r'), h = num('cone-h');\n    const l = Math.sqrt(r * r + h * h);\n    set('cone-l', l);\n    set('cone-vol', (PI * r * r * h) / 3);\n    set('cone-ssa', PI * r * l);\n    set('cone-tsa', PI * r * (r + l));\n\n    const R = num('fru-R'), fr = num('fru-r'), fh = num('fru-h');\n    set('fru-vol', (PI * fh / 3) * (R * R + fr * fr + R * fr));\n    set('fru-area', PI * (R + fr) * Math.sqrt(fh * fh + (R - fr) * (R - fr)));\n\n    const cfhv = num('cfh-v'), cfhr = num('cfh-r');\n    set('cfh-res', (cfhv > 0 && cfhr > 0) ? (cfhv * 3) / (PI * cfhr * cfhr) : 0);\n\n    const cfrv = num('cfr-v'), cfrh = num('cfr-h');\n    set('cfr-res', (cfrv > 0 && cfrh > 0) ? Math.sqrt((cfrv * 3) / (PI * cfrh)) : 0);\n  }\n\n  // 14. Sphere + Cap + Sector\n  function calcSphere() {\n    const r = num('sph-r');\n    set('sph-vol', (4 / 3) * PI * r * r * r);\n    set('sph-sa', 4 * PI * r * r);\n\n    const cr = num('cap-r'), ch = num('cap-h');\n    set('cap-vol', (1 / 6) * PI * ch * (ch * ch + 3 * cr * cr));\n    set('cap-area', PI * (cr * cr + ch * ch));\n\n    const sR = num('ssec-R'), sr = num('ssec-r'), sh = num('ssec-h');\n    set('ssec-vol', (2 / 3) * PI * sR * sR * sh);\n    set('ssec-area', PI * sR * (sr + 2 * sh));\n  }\n\n  // 15. Hemisphere\n  function calcHemi() {\n    const r = num('hemi-r');\n    set('hemi-vol', (2 / 3) * PI * r * r * r);\n    set('hemi-ssa', 2 * PI * r * r);\n    set('hemi-tsa', 3 * PI * r * r);\n  }\n\n  // 16. Torus\n  function calcTorus() {\n    const R = num('tor-R'), r = num('tor-r');\n    set('tor-vol', 0.25 * PI * PI * (R + r) * (R - r) * (R - r));\n    set('tor-area', PI * PI * (R * R - r * r));\n  }\n\n  // Initialize all\n  calcSquare(); calcRect(); calcPara(); calcRhombus(); calcTri();\n  calcRTri(); calcTrap(); calcCircle(); calcCube(); calcCuboid();\n  calcCyl(); calcPyr(); calcCone(); calcSphere(); calcHemi(); calcTorus();\n<\/script>\n\n<\/body>\n<\/html>\n"}, {"id": "builtin_volsides", "name": "Volumes and Sides (ਆਇਤਨ ਅਤੇ ਭੁਜਾਵਾਂ)", "filename": "volumes_and_sides.html", "path": "volumes_and_sides.html", "builtin": true, "content": "<!DOCTYPE html>\n<html lang=\"pa\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Volumes and Sides (ਆਇਤਨ ਅਤੇ ਭੁਜਾਵਾਂ)<\/title>\n\n    <\!-- Google Fonts: Inter & Noto Sans Gurmukhi -->\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Gurmukhi:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n\n    <\!-- Tailwind CSS CDN -->\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <sc                          <polyline points=\"232,286 238,291 230,294\"/>\n                        <\/g>\n                        <rect x=\"131\" y=\"264\" width=\"20\" height=\"20\" rx=\"3\" fill=\"#ffffff\"/>\n                        <text x=\"141\" y=\"280\" text-anchor=\"middle\" font-family=\"Inter, sans-serif\" font-size=\"17\" font-weight=\"700\" fill=\"#0f172a\">a<\/text>\n\n                        <\!-- Red Dimension Arrows for Bottom Side a (right) -->\n                        <g stroke=\"#dc2626\" stroke-width=\"1.6\" fill=\"none\">\n                            <line x1=\"260\" y1=\"289\" x2=\"404\" y2=\"217\"/>\n                            <polyline points=\"267,290 260,289 264,283\"/>\n                            <polyline points=\"397,216 404,217 400,223\"/>\n                        <\/g>\n                        <rect x=\"328\" y=\"241\" width=\"20\" height=\"20\" rx=\"3\" fill=\"#ffffff\"/>\n                        <text x=\"338\" y=\"257\" text-anchor=\"middle\" font-family=\"Inter, sans-serif\" font-size=\"17\" font-weight=\"700\" fill=\"#0f172a\">a<\/text>\n\n                        <\!-- Bottom Formula Box -->\n                        <rect x=\"44\" y=\"308\" width=\"248\" height=\"38\" rx=\"8\" fill=\"#e8eefb\" stroke=\"#c7d5f2\" stroke-width=\"1.5\"/>\n                        <g font-family=\"Inter, sans-serif\" font-weight=\"700\" fill=\"#0f172a\">\n                            <text x=\"58\" y=\"333\" font-size=\"17\">V =<\/text>\n                            <text x=\"100\" y=\"324\" text-anchor=\"middle\" font-size=\"13\">1<\/text>\n                            <line x1=\"93\" y1=\"328\" x2=\"107\" y2=\"328\" stroke=\"#0f172a\" stroke-width=\"1.6\"/>\n                            <text x=\"100\" y=\"341\" text-anchor=\"middle\" font-size=\"13\">3<\/text>\n                            <text x=\"116\" y=\"333\" font-size=\"17\">h (a² + b² + ab)<\/text>\n                        <\/g>\n                    <\/svg>\n                <\/div>\n\n                <\!-- Pyramid RESET -->\n                <div class=\"pt-1\">\n                    <button\n                        id=\"resetPyramidBtn\"\n                        type=\"button\"\n                        class=\"w-full bg-[#155787] hover:bg-[#11466d] active:scale-[0.99] transition text-white font-bold text-base py-3.5 rounded-lg shadow-md tracking-wider\"\n                    >\n                        RESET\n                    <\/button>\n                <\/div>\n            <\/section>\n\n        <\/main>\n\n        <\!-- Fixed Mobile-Style 5-Tab Bottom Navigation Bar -->\n        <nav aria-label=\"Bottom Navigation\" class=\"fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[560px] z-30 bg-white border-t border-slate-300 shadow-[0_-2px_10px_rgba(0,0,0,0.08)] grid grid-cols-5\">\n            <button\n                type=\"button\"\n                data-page=\"page-main\"\n                class=\"nav-tab py-2.5 px-1 text-center text-[10px] sm:text-xs font-bold leading-tight transition-colors flex items-center justify-center min-h-[58px] bg-[#155787] text-white\"\n            >\n                MAIN\n            <\/button>\n            <button\n                type=\"button\"\n                data-page=\"page-cylinder\"\n                class=\"nav-tab py-2.5 px-1 text-center text-[10px] sm:text-xs font-bold leading-tight transition-colors flex items-center justify-center min-h-[58px] bg-white text-slate-800 hover:bg-slate-100 border-l border-slate-200\"\n            >\n                ਸਿਲੰਡਰ\n            <\/button>\n            <button\n                type=\"button\"\n                data-page=\"page-cone\"\n                class=\"nav-tab py-2.5 px-1 text-center text-[10px] sm:text-xs font-bold leading-tight transition-colors flex items-center justify-center min-h-[58px] bg-white text-slate-800 hover:bg-slate-100 border-l border-slate-200\"\n            >\n                ਸ਼ੰਕੂ\n            <\/button>\n            <button\n                type=\"button\"\n                data-page=\"page-frustum-torus\"\n                class=\"nav-tab py-2.5 px-1 text-center text-[10px] sm:text-xs font-bold leading-tight transition-colors flex items-center justify-center min-h-[58px] bg-white text-slate-800 hover:bg-slate-100 border-l border-slate-200\"\n            >\n                ਸੰਕੂ ਖੰਡ / ਟਿਊਬ\n            <\/button>\n            <button\n                type=\"button\"\n                data-page=\"page-pyramid\"\n                class=\"nav-tab py-2.5 px-1 text-center text-[10px] sm:text-xs font-bold leading-tight transition-colors flex items-center justify-center min-h-[58px] bg-white text-slate-800 hover:bg-slate-100 border-l border-slate-200\"\n            >\n                ਪਿਰਾਮਿੰਡ ਖੰਡ\n            <\/button>\n        <\/nav>\n\n        <\!-- Non-blocking Toast Feedback Banner -->\n        <div id=\"toast\" class=\"fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-white text-xs sm:text-sm font-medium px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-200\">\n            Reset complete\n        <\/div>\n\n    <\/div>\n\n    <\!-- ========================================================= -->\n    <\!-- ZOOMED DIAGRAM PREVIEW MODAL                              -->\n    <\!-- ========================================================= -->\n    <div id=\"zoomModal\" class=\"fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-xs p-3 sm:p-5\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"zoomModalTitle\">\n        <div class=\"bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]\">\n            <div class=\"bg-[#115c19] text-white px-4 py-3 flex items-center justify-between\">\n                <h2 id=\"zoomModalTitle\" class=\"font-bold text-sm sm:text-base truncate pr-3\">Diagram Preview<\/h2>\n                <button id=\"closeZoomModalBtn\" type=\"button\" aria-label=\"Close Preview\" class=\"p-1.5 rounded-lg hover:bg-white/20 transition shrink-0\">\n                    <svg class=\"w-5 h-5\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\">\n                        <line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\/line>\n                        <line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\/line>\n                    <\/svg>\n                <\/button>\n            <\/div>\n            <div id=\"zoomModalContent\" class=\"p-4 sm:p-6 overflow-auto bg-white flex items-center justify-center\">\n                <\!-- Cloned SVG injected here -->\n            <\/div>\n            <div class=\"px-4 py-3 bg-slate-50 border-t border-slate-200 flex justify-end\">\n                <button id=\"closeZoomModalFooterBtn\" type=\"button\" class=\"bg-[#155787] hover:bg-[#11466d] text-white text-sm font-semibold px-5 py-2 rounded-lg transition\">\n                    ਬੰਦ ਕਰੋ (Close)\n                <\/button>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <\!-- ========================================================= -->\n    <\!-- APPLICATION LOGIC                                         -->\n    <\!-- ========================================================= -->\n    <script>\n        (function () {\n            'use strict';\n\n            const $ = (id) => document.getElementById(id);\n\n            /** Parse numeric input cleanly; returns NaN if empty or invalid */\n            function readNum(id) {\n                const raw = $(id).value.trim();\n                if (raw === '') return NaN;\n                const num = Number(raw);\n                return Number.isFinite(num) ? num : NaN;\n            }\n\n            /** Format numeric output to 2 decimal places, handling invalid/NaN values */\n            function fmt(value) {\n                if (!Number.isFinite(value)) return '—';\n                const clean = Math.abs(value) < 1e-12 ? 0 : value;\n                return clean.toFixed(2);\n            }\n\n            /** Display a brief toast notification (never using alert) */\n            let toastTimer = null;\n            function showToast(msg) {\n                const el = $('toast');\n                el.textContent = msg;\n                el.classList.remove('opacity-0');\n                el.classList.add('opacity-100');\n                clearTimeout(toastTimer);\n                toastTimer = setTimeout(() => {\n                    el.classList.remove('opacity-100');\n                    el.classList.add('opacity-0');\n                }, 1700);\n            }\n\n            // ---------------------------------------------------------\n            // Navigation Between 5 Pages\n            // ---------------------------------------------------------\n            const pages = document.querySelectorAll('.app-page');\n            const navTabs = document.querySelectorAll('.nav-tab');\n\n            function navigateTo(pageId) {\n                pages.forEach((p) => {\n                    if (p.id === pageId) {\n                        p.classList.remove('hidden');\n                        // Re-trigger smooth entrance animation\n                        p.classList.remove('page-animate');\n                        void p.offsetWidth;\n                        p.classList.add('page-animate');\n                    } else {\n                        p.classList.add('hidden');\n                    }\n                });\n\n                navTabs.forEach((tab) => {\n                    const isActive = tab.dataset.page === pageId;\n                    if (isActive) {\n                        tab.classList.remove('bg-white', 'text-slate-800', 'hover:bg-slate-100');\n                        tab.classList.add('bg-[#155787]', 'text-white');\n                    } else {\n                        tab.classList.remove('bg-[#155787]', 'text-white');\n                        tab.classList.add('bg-white', 'text-slate-800', 'hover:bg-slate-100');\n                    }\n                });\n\n                window.scrollTo({ top: 0, behavior: 'instant' });\n            }\n\n            navTabs.forEach((tab) => {\n                tab.addEventListener('click', () => navigateTo(tab.dataset.page));\n            });\n\n            document.querySelectorAll('.menu-jump-btn').forEach((btn) => {\n                btn.addEventListener('click', () => navigateTo(btn.dataset.jump));\n            });\n\n            $('headerHomeBtn').addEventListener('click', () => navigateTo('page-main'));\n\n            // ---------------------------------------------------------\n            // Zoomable SVG Diagram Modal\n            // ---------------------------------------------------------\n            const zoomModal = $('zoomModal');\n            const zoomModalTitle = $('zoomModalTitle');\n            const zoomModalContent = $('zoomModalContent');\n\n            function openZoomModal(title, svgElement) {\n                zoomModalTitle.textContent = title || 'Diagram Preview';\n                zoomModalContent.innerHTML = '';\n                const clone = svgElement.cloneNode(true);\n                clone.classList.remove('max-w-[380px]');\n                clone.classList.add('w-full', 'h-auto', 'max-h-[70vh]');\n                zoomModalContent.appendChild(clone);\n                zoomModal.classList.remove('hidden');\n                zoomModal.classList.add('flex');\n            }\n\n            function closeZoomModal() {\n                zoomModal.classList.add('hidden');\n                zoomModal.classList.remove('flex');\n            }\n\n            document.querySelectorAll('.zoomable-diagram').forEach((card) => {\n                card.addEventListener('click', () => {\n                    const svg = card.querySelector('svg');\n                    if (svg) openZoomModal(card.dataset.title, svg);\n                });\n            });\n\n            $('closeZoomModalBtn').addEventListener('click', closeZoomModal);\n            $('closeZoomModalFooterBtn').addEventListener('click', closeZoomModal);\n            zoomModal.addEventListener('click', (e) => {\n                if (e.target === zoomModal) closeZoomModal();\n            });\n            document.addEventListener('keydown', (e) => {\n                if (e.key === 'Escape' && !zoomModal.classList.contains('hidden')) {\n                    closeZoomModal();\n                }\n            });\n\n            // ---------------------------------------------------------\n            // PAGE 2 CALCULATIONS: ਸਿਲੰਡਰ (CYLINDER)\n            // ---------------------------------------------------------\n            function calcCylinder() {\n                try {\n                    // 1. Volume = pi * R^2 * H\n                    const vr = readNum('cyl_v_r');\n                    const vh = readNum('cyl_v_h');\n                    $('cyl_v_res').textContent = (Number.isFinite(vr) && Number.isFinite(vh))\n                        ? fmt(Math.PI * vr * vr * vh)\n                        : '—';\n\n                    // 2. Radius from Volume & Height = sqrt(V / (pi * H))\n                    const rv = readNum('cyl_r_v');\n                    const rh = readNum('cyl_r_h');\n                    if (Number.isFinite(rv) && Number.isFinite(rh) && rh !== 0 && (rv / (Math.PI * rh)) >= 0) {\n                        $('cyl_r_res').textContent = fmt(Math.sqrt(rv / (Math.PI * rh)));\n                    } else {\n                        $('cyl_r_res').textContent = '—';\n                    }\n\n                    // 3. Height from Volume & Radius = V / (pi * R^2)\n                    const hv = readNum('cyl_h_v');\n                    const hr = readNum('cyl_h_r');\n                    if (Number.isFinite(hv) && Number.isFinite(hr) && hr !== 0) {\n                        $('cyl_h_res').textContent = fmt(hv / (Math.PI * hr * hr));\n                    } else {\n                        $('cyl_h_res').textContent = '—';\n                    }\n\n                    // 4. Curved Surface Area = 2 * pi * R * H\n                    const ar = readNum('cyl_a_r');\n                    const ah = readNum('cyl_a_h');\n                    $('cyl_a_res').textContent = (Number.isFinite(ar) && Number.isFinite(ah))\n                        ? fmt(2 * Math.PI * ar * ah)\n                        : '—';\n\n                    // 5. Radius from Area & H = AREA / (2 * pi * H)\n                    const ara = readNum('cyl_ar_a');\n                    const arh = readNum('cyl_ar_h');\n                    if (Number.isFinite(ara) && Number.isFinite(arh) && arh !== 0) {\n                        $('cyl_ar_res').textContent = fmt(ara / (2 * Math.PI * arh));\n                    } else {\n                        $('cyl_ar_res').textContent = '—';\n                    }\n\n                    // 6. Height from Area & R = AREA / (2 * pi * R)\n                    const aha = readNum('cyl_ah_a');\n                    const ahr = readNum('cyl_ah_r');\n                    if (Number.isFinite(aha) && Number.isFinite(ahr) && ahr !== 0) {\n                        $('cyl_ah_res').textContent = fmt(aha / (2 * Math.PI * ahr));\n                    } else {\n                        $('cyl_ah_res').textContent = '—';\n                    }\n                } catch (err) {\n                    console.error('Cylinder calculation error:', err);\n                }\n            }\n\n            // ---------------------------------------------------------\n            // PAGE 3 CALCULATIONS: ਸ਼ੰਕੂ (CONE)\n            // ---------------------------------------------------------\n            function calcCone() {\n                try {\n                    // 1. Volume = pi * R^2 * H / 3\n                    const vr = readNum('cone_v_r');\n                    const vh = readNum('cone_v_h');\n                    $('cone_v_res').textContent = (Number.isFinite(vr) && Number.isFinite(vh))\n                        ? fmt((Math.PI * vr * vr * vh) / 3)\n                        : '—';\n\n                    // 2. Height from Volume & R = V * 3 / (pi * R^2)\n                    const hv = readNum('cone_h_v');\n                    const hr = readNum('cone_h_r');\n                    if (Number.isFinite(hv) && Number.isFinite(hr) && hr !== 0) {\n                        $('cone_h_res').textContent = fmt((hv * 3) / (Math.PI * hr * hr));\n                    } else {\n                        $('cone_h_res').textContent = '—';\n                    }\n\n                    // 3. Radius from Volume & Height = sqrt(V * 3 / (pi * H))\n                    const rv = readNum('cone_r_v');\n                    const rh = readNum('cone_r_h');\n                    if (Number.isFinite(rv) && Number.isFinite(rh) && rh !== 0 && ((rv * 3) / (Math.PI * rh)) >= 0) {\n                        $('cone_r_res').textContent = fmt(Math.sqrt((rv * 3) / (Math.PI * rh)));\n                    } else {\n                        $('cone_r_res').textContent = '—';\n                    }\n\n                    // 4. Area = pi * R * L\n                    const ar = readNum('cone_a_r');\n                    const al = readNum('cone_a_l');\n                    $('cone_a_res').textContent = (Number.isFinite(ar) && Number.isFinite(al))\n                        ? fmt(Math.PI * ar * al)\n                        : '—';\n                } catch (err) {\n                    console.error('Cone calculation error:', err);\n                }\n            }\n\n            // ---------------------------------------------------------\n            // PAGE 4 CALCULATIONS: ਸੰਕੂ ਖੰਡ ਅਤੇ ਟਿਊਬ (FRUSTUM & TORUS)\n            // ---------------------------------------------------------\n            function calcFrustumTorus() {\n                try {\n                    // Frustum of Right Circular Cone\n                    const fR = readNum('frus_R');\n                    const fr = readNum('frus_r');\n                    const fH = readNum('frus_H');\n                    if (Number.isFinite(fR) && Number.isFinite(fr) && Number.isFinite(fH)) {\n                        const vol = (1 / 3) * Math.PI * fH * (fR * fR + fr * fr + fR * fr);\n                        const slant = Math.sqrt(fH * fH + (fR - fr) * (fR - fr));\n                        const area = Math.PI * (fR + fr) * slant;\n                        $('frus_vol_res').textContent = fmt(vol);\n                        $('frus_area_res').textContent = fmt(area);\n                    } else {\n                        $('frus_vol_res').textContent = '—';\n                        $('frus_area_res').textContent = '—';\n                    }\n\n                    // Torus\n                    const tR = readNum('torus_R');\n                    const tr = readNum('torus_r');\n                    const warnEl = $('torus_warn');\n\n                    if (!Number.isFinite(tR) || !Number.isFinite(tr)) {\n                        warnEl.classList.add('hidden');\n                        $('torus_vol_res').textContent = '—';\n                        $('torus_area_res').textContent = '—';\n                    } else if (tR < tr) {\n                        warnEl.classList.remove('hidden');\n                        $('torus_vol_res').textContent = '0.00';\n                        $('torus_area_res').textContent = '0.00';\n                    } else {\n                        warnEl.classList.add('hidden');\n                        const vol = 0.25 * Math.PI * Math.PI * (tR + tr) * Math.pow(tR - tr, 2);\n                        const area = Math.PI * Math.PI * (tR * tR - tr * tr);\n                        $('torus_vol_res').textContent = fmt(vol);\n                        $('torus_area_res').textContent = fmt(area);\n                    }\n                } catch (err) {\n                    console.error('Frustum/Torus calculation error:', err);\n                }\n            }\n\n            // ---------------------------------------------------------\n            // PAGE 5 CALCULATIONS: PYRAMID FRUSTUM\n            // ---------------------------------------------------------\n            function calcPyramid() {\n                try {\n                    const l1 = readNum('pyr_l1');\n                    const b1 = readNum('pyr_b1');\n                    const l2 = readNum('pyr_l2');\n                    const b2 = readNum('pyr_b2');\n                    const h = readNum('pyr_h');\n\n                    if (\n                        Number.isFinite(l1) &&\n                        Number.isFinite(b1) &&\n                        Number.isFinite(l2) &&\n                        Number.isFinite(b2) &&\n                        Number.isFinite(h)\n                    ) {\n                        const c1 = (l1 + b1) / 2;\n                        const c2 = (l2 + b2) / 2;\n                        const volume = (h / 3) * (c1 * c1 + c2 * c2 + c1 * c2);\n                        const sqrFeet = volume / 1728;\n                        $('pyr_vol_res').textContent = fmt(volume);\n                        $('pyr_sqft_res').textContent = fmt(sqrFeet);\n                    } else {\n                        $('pyr_vol_res').textContent = '—';\n                        $('pyr_sqft_res').textContent = '—';\n                    }\n                } catch (err) {\n                    console.error('Pyramid Frustum calculation error:', err);\n                }\n            }\n\n            // ---------------------------------------------------------\n            // Live Input Event Listeners\n            // ---------------------------------------------------------\n            [\n                'cyl_v_r', 'cyl_v_h',\n                'cyl_r_v', 'cyl_r_h',\n                'cyl_h_v', 'cyl_h_r',\n                'cyl_a_r', 'cyl_a_h',\n                'cyl_ar_a', 'cyl_ar_h',\n                'cyl_ah_a', 'cyl_ah_r'\n            ].forEach((id) => $(id).addEventListener('input', calcCylinder));\n\n            [\n                'cone_v_r', 'cone_v_h',\n                'cone_h_v', 'cone_h_r',\n                'cone_r_v', 'cone_r_h',\n                'cone_a_r', 'cone_a_l'\n            ].forEach((id) => $(id).addEventListener('input', calcCone));\n\n            [\n                'frus_R', 'frus_r', 'frus_H',\n                'torus_R', 'torus_r'\n            ].forEach((id) => $(id).addEventListener('input', calcFrustumTorus));\n\n            [\n                'pyr_l1', 'pyr_b1', 'pyr_l2', 'pyr_b2', 'pyr_h'\n            ].forEach((id) => $(id).addEventListener('input', calcPyramid));\n\n            // ---------------------------------------------------------\n            // Reset Buttons\n            // ---------------------------------------------------------\n            $('resetCylinderBtn').addEventListener('click', () => {\n                $('cyl_v_r').value = '14';\n                $('cyl_v_h').value = '11';\n                $('cyl_r_v').value = '600';\n                $('cyl_r_h').value = '11';\n                $('cyl_h_v').value = '400';\n                $('cyl_h_r').value = '14';\n                $('cyl_a_r').value = '7';\n                $('cyl_a_h').value = '5';\n                $('cyl_ar_a').value = '219.91';\n                $('cyl_ar_h').value = '5';\n                $('cyl_ah_a').value = '219.91';\n                $('cyl_ah_r').value = '7';\n                calcCylinder();\n                showToast('ਸਿਲੰਡਰ ਰੀਸੈੱਟ ਕੀਤਾ ਗਿਆ (Reset)');\n            });\n\n            $('resetConeBtn').addEventListener('click', () => {\n                $('cone_v_r').value = '3';\n                $('cone_v_h').value = '4';\n                $('cone_h_v').value = '37.7';\n                $('cone_h_r').value = '3';\n                $('cone_r_v').value = '37.7';\n                $('cone_r_h').value = '4';\n                $('cone_a_r').value = '3';\n                $('cone_a_l').value = '4';\n                calcCone();\n                showToast('ਸ਼ੰਕੂ ਰੀਸੈੱਟ ਕੀਤਾ ਗਿਆ (Reset)');\n            });\n\n            $('resetFrustumTorusBtn').addEventListener('click', () => {\n                $('frus_R').value = '3';\n                $('frus_r').value = '2';\n                $('frus_H').value = '4';\n                $('torus_R').value = '4';\n                $('torus_r').value = '3';\n                calcFrustumTorus();\n                showToast('ਸੰਕੂ ਖੰਡ ਅਤੇ ਟਿਊਬ ਰੀਸੈੱਟ ਕੀਤਾ ਗਿਆ (Reset)');\n            });\n\n            $('resetPyramidBtn').addEventListener('click', () => {\n                $('pyr_l1').value = '200';\n                $('pyr_b1').value = '150';\n                $('pyr_l2').value = '100';\n                $('pyr_b2').value = '75';\n                $('pyr_h').value = '3';\n                calcPyramid();\n                showToast('ਪਿਰਾਮਿੰਡ ਖੰਡ ਰੀਸੈੱਟ ਕੀਤਾ ਗਿਆ (Reset)');\n            });\n\n            // ---------------------------------------------------------\n            // Initial Calculation on Page Load\n            // ---------------------------------------------------------\n            calcCylinder();\n            calcCone();\n            calcFrustumTorus();\n            calcPyramid();\n        })();\n    <\/script>\n<\/body>\n<\/html>"}, {"id": "builtin_triangles", "name": "Triangles, Area and Sides", "filename": "triangles_area_and_sides.html", "path": "triangles_area_and_sides.html", "builtin": true, "content": "<!DOCTYPE html>\n<html lang=\"pa\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Triangles, Area and Sides<\/title>\n\n    <\!-- Google Fonts: Inter & Noto Sans Gurmukhi for crisp English and Punjabi rendering -->\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\n    <\!-- Tailwind CSS CDN -->\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <script>\n        tailwind.config = {\n            theme: {\n                extend: {\n                    fontFamily: {\n                        sans: ['Inter', 'Noto Sans Gurmukhi', 'system-ui', '-apple-system', 'sans-serif'],\n                    }\n                }\n            }\n        }\n    <\/script>\n\n    <\!-- Minimal utility styles for number inputs and smooth transitions -->\n    <style>\n        /* Remove default number input spin buttons for a clean mobile-app look */\n        input[type=\"number\"]::-webkit-inner-spin-button,\n        input[type=\"number\"]::-webkit-outer-spin-button {\n            -webkit-appearance: none;\n            margin: 0;\n        }\n        input[type=\"number\"] {\n            -moz-appearance: textfield;\n        }\n        /* Smooth scrolling inside the app viewport */\n        html, body {\n            overscroll-behavior-y: contain;\n        }\n    <\/style>\n<\/head>\n<body class=\"bg-[#e8eaed] font-sans text-slate-900 min-h-screen flex justify-center\">\n\n    <\!-- Main Centered Mobile/Tablet App Shell -->\n    <div class=\"w-full max-w-[680px] min-h-screen bg-[#e8eaed] shadow-2xl flex flex-col relative\">\n\n        <\!-- Sticky Top App Bar -->\n        <header class=\"sticky top-0 z-30 bg-[#115e1c] text-white px-4 py-3.5 shadow-md flex items-center justify-between\">\n            <div class=\"flex items-center gap-3 min-w-0\">\n                <\!-- App Icon -->\n                <div class=\"w-8 h-8 rounded-lg bg-white/15 flex items-center justify-center shrink-0\">\n                    <svg class=\"w-5 h-5 text-white\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                        <path d=\"M4 20h16L4 4v16z\"><\/path>\n                        <path d=\"M4 15h5v5\"><\/path>\n                    <\/svg>\n                <\/div>\n                <h1 class=\"text-lg sm:text-xl font-semibold tracking-tight truncate\">Triangles, Area and Sides<\/h1>\n            <\/div>\n\n            <\!-- Formula Reference Modal Toggle Button -->\n            <button\n                id=\"openFormulaModalBtn\"\n                type=\"button\"\n                aria-label=\"Open Trigonometry Formulas\"\n                title=\"Trigonometry Formulas / ਸੂਤਰ\"\n                class=\"flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25 active:scale-95 transition text-xs sm:text-sm font-medium shrink-0\"\n            >\n                <svg class=\"w-4 h-4\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                    <circle cx=\"12\" cy=\"12\" r=\"10\"><\/circle>\n                    <line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"><\/line>\n                    <line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"><\/line>\n                <\/svg>\n                <span>ਸੂਤਰ<\/span>\n            <\/button>\n        <\/header>\n\n        <\!-- Main Scrollable Content Area -->\n        <main class=\"flex-1 p-3 sm:p-4 pb-24 space-y-4 overflow-x-hidden\">\n\n            <\!-- ========================================================= -->\n            <\!-- TAB 1: L, B or H ਪਤਾ ਕਰਨਾ                                -->\n            <\!-- ========================================================= -->\n            <section id=\"tab-1\" class=\"tab-panel space-y-3.5\">\n\n                <\!-- Collapsible Reference Card -->\n                <div class=\"bg-white rounded-[10px] shadow-md overflow-hidden border border-slate-200/80\">\n                    <button\n                        id=\"toggleRefCardBtn\"\n                        type=\"button\"\n                        class=\"w-full px-4 py-2.5 flex items-center justify-between bg-slate-50 hover:bg-slate-100 transition text-left\"\n                    >\n                        <span class=\"text-sm font-semibold text-[#0e5e55] flex items-center gap-2\">\n                            <svg class=\"w-4 h-4 text-[#155787]\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\">\n                                <path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"><\/path>\n                                <path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"><\/path>\n                            <\/svg>\n                            ਤ੍ਰਿਕੋਣਮਿਤੀ ਸੂਤਰ (Trigonometry Reference)\n                        <\/span>\n                        <svg id=\"refCardChevron\" class=\"w-5 h-5 text-slate-500 transition-transform duration-200 rotate-180\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n                            <polyline points=\"6 9 12 15 18 9\"><\/polyline>\n                        <\/svg>\n                    <\/button>\n\n                    <div id=\"refCardBody\" class=\"p-3 sm:p-4 grid grid-cols-1 sm:grid-cols-2 gap-3 items-center border-t border-slate-100\">\n                        <\!-- Right-Angled Triangle SVG -->\n                        <div class=\"flex justify-center\">\n                            <svg viewBox=\"0 0 260 165\" class=\"w-full max-w-[240px] h-auto\" role=\"img\" aria-label=\"Right angled triangle diagram\">\n                                <\!-- Triangle Fill & Outline -->\n                                <polygon points=\"48,22 48,136 228,136\" fill=\"#f0f7ff\" stroke=\"#0f172a\" stroke-width=\"3.5\" stroke-linejoin=\"round\"/>\n                                <\!-- Right Angle Marker -->\n                                <polyline points=\"48,120 64,120 64,136\" fill=\"none\" stroke=\"#155787\" stroke-width=\"2\"/>\n                                <\!-- Angle Arc at Bottom Right -->\n                                <path d=\"M 182 136 A 46 46 0 0 1 192 108\" fill=\"none\" stroke=\"#9c0606\" stroke-width=\"2.8\"/>\n                                <\!-- Labels -->\n                                <text x=\"36\" y=\"84\" text-anchor=\"end\" font-size=\"16\" font-weight=\"700\" fill=\"#0f172a\">ਲੰਬ<\/text>\n                                <text x=\"138\" y=\"156\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" fill=\"#0f172a\">ਆਧਾਰ<\/text>\n                                <text x=\"150\" y=\"68\" text-anchor=\"start\" font-size=\"16\" font-weight=\"700\" fill=\"#155787\">ਕਰਨ<\/text>\n                                <text x=\"172\" y=\"128\" text-anchor=\"end\" font-size=\"14\" font-weight=\"700\" fill=\"#9c0606\">ਕੋਣ<\/text>\n                            <\/svg>\n                        <\/div>\n\n                        <\!-- 6 Trigonometric Formulas -->\n                        <div class=\"grid grid-cols-2 sm:grid-cols-1 gap-1.5 text-xs sm:text-sm font-semibold text-slate-800 bg-slate-50 p-3 rounded-lg border border-slate-200/70\">\n                            <div><span class=\"text-[#155787] font-bold\">sin<\/span> = ਲੰਬ / ਕਰਨ<\/div>\n                            <div><span class=\"text-[#155787] font-bold\">cos<\/span> = ਆਧਾਰ / ਕਰਨ<\/div>\n                            <div><span class=\"text-[#155787] font-bold\">tan<\/span> = ਲੰਬ / ਆਧਾਰ<\/div>\n                            <div><span class=\"text-[#155787] font-bold\">cosec<\/span> = ਕਰਨ / ਲੰਬ<\/div>\n                            <div><span class=\"text-[#155787] font-bold\">sec<\/span> = ਕਰਨ / ਆਧਾਰ<\/div>\n                            <div><span class=\"text-[#155787] font-bold\">cot<\/span> = ਆਧਾਰ / ਲੰਬ<\/div>\n                        <\/div>\n                    <\/div>\n                <\/div>\n\n                <\!-- Section 1.1: Find Perpendicular from Hypotenuse & Angle (SIN) -->\n                <div class=\"space-y-2\">\n                    <div class=\"bg-[#155787] text-white text-center font-semibold text-sm sm:text-base py-2.5 px-3 rounded-[10px] shadow\">\n                        ਤਿਕੋਣ ਦਾ ਲੰਬ ਪਤਾ ਕਰੋ ਕਰਨ ਅਤੇ ਕੋਣ ਤੋਂ\n                    <\/div>\n                    <div class=\"grid grid-cols-2 gap-2.5\">\n                        <label class=\"bg-[#f5f5f5] rounded-[10px] shadow p-2.5 flex flex-col justify-between min-h-[88px] cursor-text border border-white focus-within:ring-2 focus-within:ring-[#155787]\">\n                            <span class=\"text-xs sm:text-sm font-semibold text-[#0e5e55]\">ਕਰਣ<\/span>\n                            <input id=\"t1_sin_hyp\" type=\"number\" step=\"any\" inputmode=\"decimal\" value=\"45\"\n                                class=\"w-full text-center text-2xl sm:text-3xl font-bold text-[#155787] bg-transparent outline-none py-1\">\n                        <\/label>\n                        <label class=\"bg-[#f5f5f5] rounded-[10px] shadow p-2.5 flex flex-col justify-between min-h-[88px] cursor-text border border-white focus-within:ring-2 focus-within:ring-[#155787]\">\n                            <span class=\"text-xs sm:text-sm font-semibold text-[#0e5e55]\">ਕੋਣ (°)<\/span>\n                            <input id=\"t1_sin_ang\" type=\"number\" step=\"any\" inputmode=\"decimal\" value=\"70\"\n                                class=\"w-full text-center text-2xl sm:text-3xl font-bold text-[#155787] bg-transparent outline-none py-1\">\n                        <\/label>\n                    <\/div>\n                    <div class=\"bg-[#9c0606] text-white rounded-[10px] shadow p-3 min-h-[82px] flex flex-col justify-between\">\n                        <span class=\"text-xs sm:text-sm font-medium text-white/90\">ਲੰਬ SIN<\/span>\n                        <div id=\"t1_sin_res\" class=\"text-center text-2xl sm:text-3xl font-bold tracking-wide\">42.29<\/div>\n                    <\/div>\n                <\/div>\n\n                <\!-- Section 1.2: Find Perpendicular from Base & Angle (TAN) -->\n                <div class=\"space-y-2 pt-1\">\n                    <div class=\"bg-[#155787] text-white text-center font-semibold text-sm sm:text-base py-2.5 px-3 rounded-[10px] shadow\">\n                        ਲੰਬ ਪਤਾ ਕਰੋ ਆਧਾਰ ਅਤੇ ਕੋਣ ਤੋਂ\n                    <\/div>\n                    <div class=\"grid grid-cols-2 gap-2.5\">\n                        <label class=\"bg-[#f5f5f5] rounded-[10px] shadow p-2.5 flex flex-col justify-between min-h-[88px] cursor-text border border-white focus-within:ring-2 focus-within:ring-[#155787]\">\n                            <span class=\"text-xs sm:text-sm font-semibold text-[#0e5e55]\">ਆਧਾਰ<\/span>\n                            <input id=\"t1_tan_base\" type=\"number\" step=\"any\" inputmode=\"decimal\" value=\"45\"\n                                class=\"w-full text-center text-2xl sm:text-3xl font-bold text-[#155787] bg-transparent outline-none py-1\">\n                        <\/label>\n                        <label class=\"bg-[#f5f5f5] rounded-[10px] shadow p-2.5 flex flex-col justify-between min-h-[88px] cursor-text border border-white focus-within:ring-2 focus-within:ring-[#155787]\">\n                            <span class=\"text-xs sm:text-sm font-semibold text-[#0e5e55]\">ਕੋਣ (°)<\/span>\n                            <input id=\"t1_tan_ang\" type=\"number\" step=\"any\" inputmode=\"decimal\" value=\"45\"\n                                class=\"w-full text-center text-2xl sm:text-3xl font-bold text-[#155787] bg-transparent outline-none py-1\">\n                        <\/label>\n                    <\/div>\n                    <div class=\"bg-[#9c0606] text-white rounded-[10px] shadow p-3 min-h-[82px] flex flex-col justify-between\">\n                        <span class=\"text-xs sm:text-sm font-medium text-white/90\">ਲੰਬ TAN<\/span>\n                        <div id=\"t1_tan_res\" class=\"text-center text-2xl sm:text-3xl font-bold tracking-wide\">45.00<\/div>\n                    <\/div>\n                <\/div>\n\n                <\!-- Section 1.3: Find Base from Hypotenuse & Angle (COS) -->\n                <div class=\"space-y-2 pt-1\">\n                    <div class=\"bg-[#155787] text-white text-center font-semibold text-sm sm:text-base py-2.5 px-3 rounded-[10px] shadow\">\n                        ਅਧਾਰ ਪਤਾ ਕਰੋ, ਕਰਨ ਅਤੇ ਕੋਣ ਤੋਂ\n                    <\/div>\n                    <div class=\"grid grid-cols-2 gap-2.5\">\n                        <label class=\"bg-[#f5f5f5] rounded-[10px] shadow p-2.5 flex flex-col justify-between min-h-[88px] cursor-text border border-white focus-within:ring-2 focus-within:ring-[#155787]\">\n                            <span class=\"text-xs sm:text-sm font-semibold text-[#0e5e55]\">ਕਰਣ<\/span>\n                            <input id=\"t1_cos_hyp\" type=\"number\" step=\"any\" inputmode=\"decimal\" value=\"45\"\n                                class=\"w-full text-center text-2xl sm:text-3xl font-bold text-[#155787] bg-transparent outline-none py-1\">\n                        <\/label>\n                        <label class=\"bg-[#f5f5f5] rounded-[10px] shadow p-2.5 flex flex-col justify-between min-h-[88px] cursor-text border border-white focus-within:ring-2 focus-within:ring-[#155787]\">\n                            <span class=\"text-xs sm:text-sm font-semibold text-[#0e5e55]\">ਕੋਣ (°)<\/span>\n                            <input id=\"t1_cos_ang\" type=\"number\" step=\"any\" inputmode=\"decimal\" value=\"70\"\n                                class=\"w-full text-center text-2xl sm:text-3xl font-bold text-[#155787] bg-transparent outline-none py-1\">\n                        <\/label>\n                    <\/div>\n                    <div class=\"bg-[#9c0606] text-white rounded-[10px] shadow p-3 min-h-[82px] flex flex-col justify-between\">\n                        <span class=\"text-xs sm:text-sm font-medium text-white/90\">ਆਧਾਰ COS<\/span>\n                        <div id=\"t1_cos_res\" class=\"text-center text-2xl sm:text-3xl font-bold tracking-wide\">15.39<\/div>\n                    <\/div>\n                <\/div>\n\n                <\!-- Section 1.4: Find Base from Perpendicular & Angle (COT) -->\n                <div class=\"space-y-2 pt-1\">\n                    <div class=\"bg-[#155787] text-white text-cente
