s = { parents: '', teacher: '', head: '' };\n\nfunction loadData() {\n  try {\n    const raw = localStorage.getItem(STORAGE_KEY);\n    students = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_STUDENTS));\n    const sraw = localStorage.getItem(SETTINGS_KEY);\n    if (sraw) settings = {...DEFAULT_SETTINGS, ...JSON.parse(sraw)};\n    const subjRaw = localStorage.getItem(SUBJECTS_KEY);\n    if (subjRaw) {\n      const parsedS = JSON.parse(subjRaw);\n      if (Array.isArray(parsedS) && parsedS.length) SUBJECTS = parsedS;\n    }\n    const csRaw = localStorage.getItem(CLASS_SUBJ_KEY);\n    if (csRaw) {\n      const parsedCS = JSON.parse(csRaw);\n      classSubjects = createDefaultClassSubjects();\n      CLASSES.forEach(cls => {\n        if (Array.isArray(parsedCS[cls])) classSubjects[cls] = parsedCS[cls];\n      });\n    } else {\n      classSubjects = createDefaultClassSubjects();\n    }\n    const mraw = localStorage.getItem(MAXMARKS_KEY);\n    if (mraw) {\n      const parsedM = JSON.parse(mraw);\n      maxMarks = createDefaultMaxMarks(settings.maxPerTerm || 20);\n      CLASSES.forEach(cls => {\n        TERMS.forEach(t => {\n          SUBJECTS.forEach(s => {\n            const v = parsedM?.[cls]?.[t]?.[s.key];\n            if (v !== undefined && v !== null && !isNaN(Number(v))) {\n              maxMarks[cls][t][s.key] = Number(v);\n            }\n          });\n        });\n      });\n    } else {\n      maxMarks = createDefaultMaxMarks(settings.maxPerTerm || 20);\n    }\n    schoolLogo = localStorage.getItem(LOGO_KEY) || '';\n    const lraw = localStorage.getItem(LAYOUT_KEY);\n    if (lraw) {\n      const parsedL = JSON.parse(lraw);\n      mediaLayout = {\n        logo:  { ...DEFAULT_MEDIA_LAYOUT.logo,  ...(parsedL.logo || {}) },\n        photo: { ...DEFAULT_MEDIA_LAYOUT.photo, ...(parsedL.photo || {}) }\n      };\n      ['logo', 'photo'].forEach(k => {\n        mediaLayout[k].x = Math.max(0, Math.min(DMC_BASE_WIDTH - mediaLayout[k].w, mediaLayout[k].x));\n        mediaLayout[k].y = Math.max(0, Math.min(DMC_BASE_HEIGHT - mediaLayout[k].h, mediaLayout[k].y));\n      });\n    }\n    const sigRaw = localStorage.getItem(SIGS_KEY);\n    if (sigRaw) sigImages = { parents: '', teacher: '', head: '', ...JSON.parse(sigRaw) };\n  } catch (e) {\n    students = JSON.parse(JSON.stringify(DEFAULT_STUDENTS));\n  }\n  updateTopHeader();\n}\n\nfunction persistData() {\n  localStorage.setItem(STORAGE_KEY, JSON.stringify(students));\n}\n\nfunction updateTopHeader() {\n  const el = document.getElementById('schoolSubTitle');\n  if (el) el.textContent = `${settings.school}, ${settings.village} (${settings.block})`;\n}\n\nfunction getGrade(pct) {\n  if (pct === '' || pct === null || isNaN(pct)) return '';\n  if (pct >= 80) return 'A';\n  if (pct >= 65) return 'B';\n  if (pct >= 50) return 'C';\n  if (pct >= 33) return 'D';\n  return 'E';\n}\n\nfunction persistMaxMarks() {\n  localStorage.setItem(MAXMARKS_KEY, JSON.stringify(maxMarks));\n}\n\nfunction persistSubjects() {\n  localStorage.setItem(SUBJECTS_KEY, JSON.stringify(SUBJECTS));\n  localStorage.setItem(CLASS_SUBJ_KEY, JSON.stringify(classSubjects));\n}\n\nfunction getClassSubjects(cls) {\n  const enabled = classSubjects[cls] || SUBJECTS.map(s => s.key);\n  return SUBJECTS.filter(s => enabled.includes(s.key));\n}\n\nfunction getSubjectMax(cls, term, subjKey) {\n  if (term === 'Annual') {\n    return TERMS.reduce((acc, t) => acc + getSubjectMax(cls, t, subjKey), 0);\n  }\n  const v = maxMarks?.[cls]?.[term]?.[subjKey];\n  return (v !== undefined && v !== null && !isNaN(Number(v))) ? Number(v) : 20;\n}\n\nfunction getTermTotalMax(cls, term) {\n  return getClassSubjects(cls).reduce((acc, s) => acc + getSubjectMax(cls, term, s.key), 0);\n}\n\nfunction getStudentTermData(stu, term) {\n  const activeSubs = getClassSubjects(stu.cls);\n  let subVals = {};\n  let subMax = {};\n  let total = 0, hasAny = false;\n  if (term === 'Annual') {\n    activeSubs.forEach(s => {\n      let sum = 0, anySub = false;\n      TERMS.forEach(t => {\n        const v = stu.marks?.[t]?.[s.key];\n        if (v !== '' && v !== undefined && v !== null && !isNaN(Number(v))) {\n          sum += Number(v);\n          anySub = true;\n          hasAny = true;\n        }\n      });\n      subVals[s.key] = anySub ? sum : '';\n      subMax[s.key] = getSubjectMax(stu.cls, 'Annual', s.key);\n      total += sum;\n    });\n  } else {\n    activeSubs.forEach(s => {\n      const v = stu.marks?.[term]?.[s.key];\n      if (v !== '' && v !== undefined && v !== null && !isNaN(Number(v))) {\n        subVals[s.key] = Number(v);\n        total += Number(v);\n        hasAny = true;\n      } else {\n        subVals[s.key] = '';\n      }\n      subMax[s.key] = getSubjectMax(stu.cls, term, s.key);\n    });\n  }\n  const maxTotal = getTermTotalMax(stu.cls, term);\n  const pct = (hasAny && maxTotal > 0) ? (total / maxTotal) * 100 : '';\n  return { subVals, subMax, activeSubs, total: hasAny ? total : '', maxTotal, pct, grade: getGrade(pct), hasAny };\n}\n\nfunction getClassRanks(cls, term) {\n  const list = students.filter(s => s.cls === cls).map(s => {\n    const d = getStudentTermData(s, term);\n    return { adm: s.adm, name: s.name, total: d.hasAny ? d.total : -1 };\n  });\n  const sorted = [...list].filter(x => x.total >= 0).sort((a, b) => b.total - a.total);\n  const rankMap = {};\n  let prevTotal = null, rank = 0;\n  sorted.forEach((item, idx) => {\n    if (item.total !== prevTotal) { rank = idx + 1; prevTotal = item.total; }\n    rankMap[item.adm + '_' + item.name] = rank;\n  });\n  return rankMap;\n}\n\n// ==================== NAVIGATION ====================\nfunction goPage(name, title) {\n  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));\n  document.getElementById('page-' + name).classList.add('active');\n  document.getElementById('backBtn').style.display = name === 'main' ? 'none' : 'inline-block';\n  const pt = document.getElementById('pageTitle');\n  if (pt) pt.textContent = title || '🏫 School Marks & DMC System';\n}\n\nfunction openMaxMarksPage(cls) {\n  if (cls) currentMaxClass = cls;\n  goPage('maxmarks', '🎯 Set Out of Total Marks');\n  renderMaxMarksClassCombo();\n  renderMaxMarksTable();\n}\n\nfunction renderMaxMarksClassCombo() {\n  const sel = document.getElementById('maxMarksClassSel');\n  if (sel) {\n    sel.innerHTML = CLASSES.map(c =>\n      `<option value=\"${c}\" ${c===currentMaxClass?'selected':''}>Class ${c}<\/option>`\n    ).join('');\n  }\n  const tEl = document.getElementById('subjAssignTitle');\n  if (tEl) tEl.textContent = `📚 Class ${currentMaxClass} ਲਈ ਜਾਰੀ ਸਬਜੈਕਟ ਚੁਣੋ (Assign Subjects)`;\n  renderMaxMarksSubjChips();\n}\n\nfunction renderMaxMarksSubjChips() {\n  const cls = currentMaxClass;\n  const enabled = classSubjects[cls] || [];\n  const wrap = document.getElementById('maxMarksSubjChips');\n  wrap.innerHTML = SUBJECTS.map(s => {\n    const isChk = enabled.includes(s.key);\n    return `<label class=\"subj-chip ${isChk?'checked':''}\">\n      <input type=\"checkbox\" ${isChk?'checked':''} onchange=\"toggleClassSubject('${cls}','${s.key}',this.checked)\">\n      <span>${s.label}<\/span>\n    <\/label>`;\n  }).join('');\n}\n\nfunction toggleClassSubject(cls, subjKey, isChecked) {\n  if (!classSubjects[cls]) classSubjects[cls] = [];\n  if (isChecked) {\n    if (!classSubjects[cls].includes(subjKey)) classSubjects[cls].push(subjKey);\n  } else {\n    classSubjects[cls] = classSubjects[cls].filter(k => k !== subjKey);\n  }\n  persistSubjects();\n  renderMaxMarksSubjChips();\n  renderMaxMarksTable();\n}\n\nfunction addCustomSubject() {\n  const inp = document.getElementById('newSubjInput');\n  const label = (inp.value || '').trim();\n  if (!label) { alert('ਕਿਰਪਾ ਕਰਕੇ ਸਬਜੈਕਟ ਦਾ ਨਾਮ ਭਰੋ।'); return; }\n  const key = label.toLowerCase().replace(/[^a-z0-9਀-੿]+/g, '_') + '_' + Date.now().toString().slice(-3);\n  if (SUBJECTS.some(s => s.label.toLowerCase() === label.toLowerCase())) {\n    alert('ਇਹ ਸਬਜੈਕਟ ਪਹਿਲਾਂ ਹੀ ਮੌਜੂਦ ਹੈ।');\n    return;\n  }\n  SUBJECTS.push({ key, label });\n  // Enable it for currentMaxClass and initialize maxMarks = 20 for all classes\n  if (!classSubjects[currentMaxClass]) classSubjects[currentMaxClass] = [];\n  classSubjects[currentMaxClass].push(key);\n  CLASSES.forEach(c => {\n    TERMS.forEach(t => {\n      if (!maxMarks[c]) maxMarks[c] = {};\n      if (!maxMarks[c][t]) maxMarks[c][t] = {};\n      maxMarks[c][t][key] = 20;\n    });\n  });\n  persistSubjects();\n  persistMaxMarks();\n  inp.value = '';\n  renderMaxMarksSubjChips();\n  renderMaxMarksTable();\n}\n\nfunction clearClassMaxMarks() {\n  const cls = currentMaxClass;\n  if (!confirm(`ਕੀ ਤੁਸੀਂ Class ${cls} ਦੇ ਸਾਰੇ Out of Total Marks (Term 1 ਤੋਂ Term 5) 0 (Clear) ਕਰਨਾ ਚਾਹੁੰਦੇ ਹੋ?`)) return;\n  TERMS.forEach(t => {\n    SUBJECTS.forEach(s => {\n      if (!maxMarks[cls]) maxMarks[cls] = {};\n      if (!maxMarks[cls][t]) maxMarks[cls][t] = {};\n      maxMarks[cls][t][s.key] = 0;\n    });\n  });\n  persistMaxMarks();\n  renderMaxMarksTable();\n}\n\nfunction clearClassStudentMarks(cls) {\n  const clsStus = students.filter(s => s.cls === cls);\n  if (!clsStus.length) { alert(`Class ${cls} ਵਿੱਚ ਕੋਈ ਵਿਦਿਆਰਥੀ ਨਹੀਂ ਹੈ।`); return; }\n  if (!confirm(`⚠️ ਕੀ ਤੁਸੀਂ Class ${cls} ਦੇ ਸਾਰੇ ${clsStus.length} ਵਿਦਿਆਰਥੀਆਂ ਦੇ ਪਹਿਲਾਂ ਤੋਂ ਐਡ ਕੀਤੇ ਸਾਰੇ ਨੰਬਰ (Term 1 ਤੋਂ Term 5) ਮਿਟਾਉਣਾ (Clear All) ਚਾਹੁੰਦੇ ਹੋ?`)) return;\n  clsStus.forEach(s => {\n    if (!s.marks) s.marks = {};\n    TERMS.forEach(t => {\n      s.marks[t] = {};\n      SUBJECTS.forEach(sub => { s.marks[t][sub.key] = ''; });\n    });\n  });\n  persistData();\n  if (document.getElementById('page-class').classList.contains('active')) renderClassTable();\n  if (document.getElementById('page-print').classList.contains('active')) renderPrintTable();\n  if (document.getElementById('page-dmc').classList.contains('active')) renderDMC();\n  alert(`✅ Class ${cls} ਦੇ ਸਾਰੇ ਵਿਦਿਆਰਥੀਆਂ ਦੇ ਨੰਬਰ ਸਾਫ਼ (Clear) ਕਰ ਦਿੱਤੇ ਗਏ ਹਨ!`);\n}\n\nfunction renderMaxMarksTable() {\n  const cls = currentMaxClass;\n  const activeSubs = getClassSubjects(cls);\n  if (!activeSubs.length) {\n    document.getElementById('maxMarksTableWrap').innerHTML = `<div style=\"padding:18px;text-align:center;color:#991b1b;background:#fef2f2;border-radius:8px;font-weight:600;\">⚠️ Class ${cls} ਲਈ ਕੋਈ ਸਬਜੈਕਟ ਚੁਣਿਆ ਨਹੀਂ ਗਿਆ। ਉੱਪਰੋਂ ਘੱਟੋ-ਘੱਟ ਇੱਕ ਸਬਜੈਕਟ ਚੁਣੋ।<\/div>`;\n    return;\n  }\n  let html = `<table class=\"grid-table\"><thead><tr>\n    <th style=\"width:130px;\">Term<\/th>`;\n  activeSubs.forEach(s => { html += `<th>${s.label}<\/th>`; });\n  html += `<th>Term Total<\/th><\/tr><\/thead><tbody>`;\n\n  TERMS.forEach(t => {\n    const rowTot = getTermTotalMax(cls, t);\n    const tid = t.replace(/\\s+/g, '_');\n    html += `<tr><td><strong>${t}<\/strong><\/td>`;\n    activeSubs.forEach(s => {\n      const v = getSubjectMax(cls, t, s.key);\n      html += `<td><input class=\"mark-in max-in\" type=\"number\" min=\"0\" value=\"${v}\" oninput=\"updateMaxMark('${cls}','${t}','${s.key}',this.value)\"><\/td>`;\n    });\n    html += `<td id=\"mm_rtot_${tid}\"><strong>${rowTot}<\/strong><\/td><\/tr>`;\n  });\n\n  // Annual Total row\n  html += `<tr class=\"max-summary-row\"><td>Annual (All 5 Terms)<\/td>`;\n  activeSubs.forEach(s => {\n    html += `<td id=\"mm_stot_${s.key}\">${getSubjectMax(cls, 'Annual', s.key)}<\/td>`;\n  });\n  html += `<td id=\"mm_gtot\">${getTermTotalMax(cls, 'Annual')}<\/td><\/tr>`;\n  html += `<\/tbody><\/table>`;\n  document.getElementById('maxMarksTableWrap').innerHTML = html;\n  enableEnterNavigation('#maxMarksTableWrap input.max-in');\n}\n\nfunction updateMaxMark(cls, term, subjKey, rawVal) {\n  const val = rawVal === '' ? 0 : Math.max(0, Number(rawVal) || 0);\n  if (!maxMarks[cls]) maxMarks[cls] = {};\n  if (!maxMarks[cls][term]) maxMarks[cls][term] = {};\n  maxMarks[cls][term][subjKey] = val;\n  persistMaxMarks();\n\n  const tid = term.replace(/\\s+/g, '_');\n  const rEl = document.getElementById('mm_rtot_' + tid);\n  if (rEl) rEl.innerHTML = `<strong>${getTermTotalMax(cls, term)}<\/strong>`;\n  const sEl = document.getElementById('mm_stot_' + subjKey);\n  if (sEl) sEl.textContent = getSubjectMax(cls, 'Annual', subjKey);\n  const gEl = document.getElementById('mm_gtot');\n  if (gEl) gEl.textContent = getTermTotalMax(cls, 'Annual');\n}\n\nfunction quickFillClassMaxMarks() {\n  const v = Math.max(0, Number(document.getElementById('quickFillVal').value) || 0);\n  TERMS.forEach(t => {\n    SUBJECTS.forEach(s => {\n      maxMarks[currentMaxClass][t][s.key] = v;\n    });\n  });\n  persistMaxMarks();\n  renderMaxMarksTable();\n}\n\nfunction copyMaxMarksToAllClasses() {\n  if (!confirm(`ਕੀ ਤੁਸੀਂ Class ${currentMaxClass} ਦੇ ਸਾਰੇ Total Marks ਅਤੇ ਚੁਣੇ ਸਬਜੈਕਟ ਬਾਕੀ ਸਾਰੀਆਂ ਕਲਾਸਾਂ 'ਤੇ ਕਾਪੀ ਕਰਨਾ ਚਾਹੁੰਦੇ ਹੋ?`)) return;\n  const srcM = JSON.stringify(maxMarks[currentMaxClass]);\n  const srcS = JSON.stringify(classSubjects[currentMaxClass] || []);\n  CLASSES.forEach(c => {\n    maxMarks[c] = JSON.parse(srcM);\n    classSubjects[c] = JSON.parse(srcS);\n  });\n  persistMaxMarks();\n  persistSubjects();\n  alert(`✅ Class ${currentMaxClass} ਦੇ Total Marks ਅਤੇ ਸਬਜੈਕਟ ਸਾਰੀਆਂ ਕਲਾਸਾਂ 'ਤੇ ਕਾਪੀ ਹੋ ਗਏ!`);\n}\n\nfunction enableEnterNavigation(selector) {\n  const inputs = Array.from(document.querySelectorAll(selector));\n  inputs.forEach((inp, idx) => {\n    inp.addEventListener('keydown', e => {\n      if (e.key === 'Enter') {\n        e.preventDefault();\n        const next = inputs[idx + 1];\n        if (next) { next.focus(); next.select(); }\n      }\n    });\n  });\n}\n\nfunction openClass(cls) {\n  currentClass = cls;\n  isEditMode = false;\n  updateEditBtnUI();\n  goPage('class', `📝 Class ${cls} — Add Marks`);\n  document.getElementById('currentClassBadge').textContent = `Class: ${cls}`;\n  document.getElementById('classSearch').value = '';\n  renderTermCombo();\n  renderClassTable();\n}\n\nfunction updateEditBtnUI() {\n  const btn = document.getElementById('toggleEditBtn');\n  if (!btn) return;\n  if (isEditMode) {\n    btn.classList.add('active');\n    btn.textContent = '✅ Done';\n  } else {\n    btn.classList.remove('active');\n    btn.textContent = '✏️ Edit';\n  }\n}\n\nfunction toggleStudentEditMode() {\n  isEditMode = !isEditMode;\n  updateEditBtnUI();\n  renderClassTable();\n}\n\nfunction renderTermCombo() {\n  const sel = document.getElementById('classTermSel');\n  if (!sel) return;\n  const opts = [...TERMS, 'Annual'];\n  sel.innerHTML = opts.map(t =>\n    `<option value=\"${t}\" ${t===currentTerm?'selected':''}>${t==='Annual'?'All Terms (Total)':t}<\/option>`\n  ).join('');\n}\n\nfunction renderClassTable() {\n  const q = (document.getElementById('classSearch').value || '').trim().toLowerCase();\n  const rows = students.map((s, idx) => ({ s, idx })).filter(({s}) =>\n    s.cls === currentClass && (!q || s.name.toLowerCase().includes(q) || s.adm.toLowerCase().includes(q) || s.father.toLowerCase().includes(q))\n  );\n\n  const isAnnual = currentTerm === 'Annual';\n  const activeSubs = getClassSubjects(currentClass);\n  let html = `<table class=\"grid-table\"><thead><tr>\n    <th>#<\/th><th>Adm.No<\/th><th>Student Name<\/th><th>Father Name<\/th>`;\n  activeSubs.forEach(sub => {\n    const mx = getSubjectMax(currentClass, currentTerm, sub.key);\n    html += `<th>${sub.label}<br><small>(/${mx})<\/small><\/th>`;\n  });\n  const totMx = getTermTotalMax(currentClass, currentTerm);\n  html += `<th>Total<br><small>(/${totMx})<\/small><\/th><th>%<\/th><th>Grade<\/th>`;\n  if (isEditMode) html += `<th class=\"no-print\">Edit<\/th>`;\n  html += `<\/tr><\/thead><tbody>`;\n\n  rows.forEach(({s, idx}, i) => {\n    const d = getStudentTermData(s, currentTerm);\n    html += `<tr>\n      <td>${i+1}<\/td>\n      <td>${s.adm}<\/td>\n      <td class=\"left\"><strong>${s.name}<\/strong><\/td>\n      <td class=\"left\">${s.father}<\/td>`;\n    activeSubs.forEach(sub => {\n      const val = d.subVals[sub.key];\n      if (isAnnual) {\n        html += `<td>${val === '' ? '—' : val}<\/td>`;\n      } else {\n        const subMx = getSubjectMax(currentClass, currentTerm, sub.key);\n        html += `<td><input class=\"mark-in\" type=\"number\" min=\"0\" max=\"${subMx}\" value=\"${val}\" oninput=\"updateMark(${idx},'${currentTerm}','${sub.key}',this.value)\"><\/td>`;\n      }\n    });\n    const pctStr = d.pct === '' ? '—' : d.pct.toFixed(1) + '%';\n    const gHtml = d.grade ? `<span class=\"badge g-${d.grade}\">${d.grade}<\/span>` : '—';\n    html += `<td id=\"tot_${idx}\"><strong>${d.total === '' ? '—' : d.total}<\/strong><\/td>\n      <td id=\"pct_${idx}\">${pctStr}<\/td>\n      <td id=\"grd_${idx}\">${gHtml}<\/td>`;\n    if (isEditMode) {\n      html += `<td class=\"no-print\" style=\"white-space:nowrap;\">\n        <button class=\"util-btn\" style=\"padding:3px 7px;\" onclick=\"openStudentModal('${s.cls}',${idx})\">✏️<\/button>\n        <button class=\"util-btn\" style=\"padding:3px 7px;color:#b91c1c;\" onclick=\"deleteStudent(${idx})\">🗑️<\/button>\n      <\/td>`;\n    }\n    html += `<\/tr>`;\n  });\n\n  if (!rows.length) html += `<tr><td colspan=\"${activeSubs.length + (isEditMode ? 8 : 7)}\" style=\"padding:18px;color:#64748b;\">ਕੋਈ ਵਿਦਿਆਰਥੀ ਨਹੀਂ ਮਿਲਿਆ।<\/td><\/tr>`;\n  html += `<\/tbody><\/table>`;\n  document.getElementById('classTableWrap').innerHTML = html;\n  enableEnterNavigation('#classTableWrap input.mark-in');\n}\n\nfunction updateMark(stuIdx, term, subj, rawVal) {\n  if (!students[stuIdx].marks) students[stuIdx].marks = {};\n  if (!students[stuIdx].marks[term]) students[stuIdx].marks[term] = {};\n  students[stuIdx].marks[term][subj] = rawVal === '' ? '' : Number(rawVal);\n  persistData();\n  const d = getStudentTermData(students[stuIdx], term);\n  document.getElementById('tot_' + stuIdx).innerHTML = `<strong>${d.total === '' ? '—' : d.total}<\/strong>`;\n  document.getElementById('pct_' + stuIdx).textContent = d.pct === '' ? '—' : d.pct.toFixed(1) + '%';\n  document.getElementById('grd_' + stuIdx).innerHTML = d.grade ? `<span class=\"badge g-${d.grade}\">${d.grade}<\/span>` : '—';\n}\n\n// ==================== CLASS WISE PRINT ====================\nfunction openPrintPage() {\n  goPage('print', '🖨️ Class Wise Result Print');\n  const sel = document.getElementById('printClassSel');\n  sel.innerHTML = CLASSES.map(c => `<option value=\"${c}\">${c}<\/option>`).join('');\n  renderPrintTable();\n}\n\nfunction renderPrintTable() {\n  const cls = document.getElementById('printClassSel').value;\n  const term = document.getElementById('printTermSel').value;\n  const list = students.filter(s => s.cls === cls);\n  const rankMap = getClassRanks(cls, term);\n  const maxTot = getTermTotalMax(cls, term);\n\n  document.getElementById('printHeader').innerHTML = `\n    <h2 style=\"color:#0f3b5c;\">${settings.school}, ${settings.village} (${settings.block})<\/h2>\n    <div style=\"font-weight:700;margin-top:3px;\">Class Wise Result Sheet — Class: ${cls} | ${term} | ${settings.session}<\/div>`;\n\n  const activeSubs = getClassSubjects(cls);\n  let html = `<table class=\"grid-table\"><thead><tr>\n    <th>S.No<\/th><th>Adm.No<\/th><th>Student Name<\/th><th>Father Name<\/th>`;\n  activeSubs.forEach(s => html += `<th>${s.label} (${getSubjectMax(cls, term, s.key)})<\/th>`);\n  html += `<th>Total (${maxTot})<\/th><th>%<\/th><th>Grade<\/th><th>Rank<\/th><\/tr><\/thead><tbody>`;\n\n  list.forEach((s, i) => {\n    const d = getStudentTermData(s, term);\n    const rk = rankMap[s.adm + '_' + s.name] || '—';\n    html += `<tr>\n      <td>${i+1}<\/td>\n      <td>${s.adm}<\/td>\n      <td class=\"left\"><strong>${s.name}<\/strong><\/td>\n      <td class=\"left\">${s.father}<\/td>`;\n    activeSubs.forEach(sub => html += `<td>${d.subVals[sub.key] === '' ? '—' : d.subVals[sub.key]}<\/td>`);\n    html += `<td><strong>${d.total === '' ? '—' : d.total}<\/strong><\/td>\n      <td>${d.pct === '' ? '—' : d.pct.toFixed(1) + '%'}<\/td>\n      <td>${d.grade ? `<span class=\"badge g-${d.grade}\">${d.grade}<\/span>` : '—'}<\/td>\n      <td><strong>${rk}<\/strong><\/td><\/tr>`;\n  });\n  html += `<\/tbody><\/table>`;\n  document.getElementById('printTableWrap').innerHTML = html;\n}\n\nfunction exportPrintCSV() {\n  const cls = document.getElementById('printClassSel').value;\n  const term = document.getElementById('printTermSel').value;\n  const list = students.filter(s => s.cls === cls);\n  const activeSubs = getClassSubjects(cls);\n  const rankMap = getClassRanks(cls, term);\n  let csv = ['S.No','Class','Adm.No','Student Name','Father Name','Mother Name','DOB',...activeSubs.map(s=>s.label),'Total','Percentage','Grade','Rank'].join(',') + '\\n';\n  list.forEach((s, i) => {\n    const d = getStudentTermData(s, term);\n    const rk = rankMap[s.adm + '_' + s.name] || '';\n    const row = [\n      i+1, s.cls, s.adm, `\"${s.name}\"`, `\"${s.father}\"`, `\"${s.mother}\"`, `\"${s.dob}\"`,\n      ...activeSubs.map(sub => d.subVals[sub.key]),\n      d.total, d.pct === '' ? '' : d.pct.toFixed(2), d.grade, rk\n    ];\n    csv += row.join(',') + '\\n';\n  });\n  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = `Result_${cls}_${term.replace(/\\s+/g,'_')}.csv`;\n  a.click();\n}\n\n// ==================== CREATE DMC ====================\nfunction openDmcPage() {\n  goPage('dmc', '📜 Create DMC (Report Card)');\n  const csel = document.getElementById('dmcClassSel');\n  csel.innerHTML = `<option value=\"ALL\">All Classes<\/option>` + CLASSES.map(c => `<option value=\"${c}\">${c}<\/option>`).join('');\n  populateDmcStudents();\n}\n\nfunction populateDmcStudents() {\n  const cls = document.getElementById('dmcClassSel').value;\n  const list = students.map((s, idx) => ({s, idx})).filter(({s}) => cls === 'ALL' || s.cls === cls);\n  const ssel = document.getElementById('dmcStudentSel');\n  ssel.innerHTML = list.map(({s, idx}) => `<option value=\"${idx}\">${s.adm} — ${s.name} (${s.cls})<\/option>`).join('');\n  renderDMC();\n}\n\nfunction renderDMC() {\n  const idx = parseInt(document.getElementById('dmcStudentSel').value, 10);\n  if (isNaN(idx) || !students[idx]) return;\n  const s = students[idx];\n  const term = document.getElementById('dmcTermSel').value;\n  const d = getStudentTermData(s, term);\n  const rankMap = getClassRanks(s.cls, term);\n  const rank = rankMap[s.adm + '_' + s.name] || '—';\n  const photo = studentPhotos[s.adm] || '';\n\n  let rowsHtml = '';\n  d.activeSubs.forEach((sub, i) => {\n    const val = d.subVals[sub.key];\n    const smx = d.subMax[sub.key];\n    const spct = (val !== '' && smx > 0) ? (val / smx) * 100 : '';\n    const sgrd = getGrade(spct);\n    rowsHtml += `<tr>\n      <td>${i+1}<\/td>\n      <td class=\"subj\">${sub.label}<\/td>\n      <td>${val === '' ? '—' : val}<\/td>\n      <td>${smx}<\/td>\n      <td>${spct === '' ? '—' : spct.toFixed(1) + '%'}<\/td>\n      <td><strong>${sgrd || '—'}<\/strong><\/td>\n    <\/tr>`;\n  });\n\n  document.getElementById('dmcSheetWrap').innerHTML = `\n    <div class=\"dmc-sheet\" id=\"dmcSheet\">\n      <div class=\"drag-box logo-box ${schoolLogo ? 'has-img' : ''}\" id=\"dragLogoBox\" data-key=\"logo\"\n           style=\"left:${mediaLayout.logo.x}px; top:${mediaLayout.logo.y}px; width:${mediaLayout.logo.w}px; height:${mediaLayout.logo.h}px;\">\n        ${schoolLogo ? `<img src=\"${schoolLogo}\" alt=\"School Logo\" draggable=\"false\">` : '<span style=\"pointer-events:none;text-align:center;\">School Logo<br><small>(Drag / Drop)<\/small><\/span>'}\n        <div class=\"rz-handle rz-nw\" data-dir=\"nw\"><\/div>\n        <div class=\"rz-handle rz-ne\" data-dir=\"ne\"><\/div>\n        <div class=\"rz-handle rz-sw\" data-dir=\"sw\"><\/div>\n        <div class=\"rz-handle rz-se\" data-dir=\"se\"><\/div>\n      <\/div>\n\n      <div class=\"drag-box photo-box ${photo ? 'has-img' : ''}\" id=\"dragPhotoBox\" data-key=\"photo\"\n           style=\"left:${mediaLayout.photo.x}px; top:${mediaLayout.photo.y}px; width:${mediaLayout.photo.w}px; height:${mediaLayout.photo.h}px;\">\n        ${photo ? `<img src=\"${photo}\" alt=\"Student Photo\" draggable=\"false\">` : '<span style=\"pointer-events:none;text-align:center;\">Student Photo<br><small>(Drag / Drop)<\/small><\/span>'}\n        <div class=\"rz-handle rz-nw\" data-dir=\"nw\"><\/div>\n        <div class=\"rz-handle rz-ne\" data-dir=\"ne\"><\/div>\n        <div class=\"rz-handle rz-sw\" data-dir=\"sw\"><\/div>\n        <div class=\"rz-handle rz-se\" data-dir=\"se\"><\/div>\n      <\/div>\n\n      <div class=\"dmc-header\">\n        <div class=\"dmc-header-text\">\n          <h2>${settings.school}<\/h2>\n          <h3>${settings.village}, ${settings.block}<\/h3>\n          <div class=\"report-badge\">REPORT CARD / DMC<\/div>\n          <div class=\"session\">${settings.session}<\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"dmc-info-grid\">\n        <div><span>Regi. Number:<\/span> <strong>${s.adm}<\/strong><\/div>\n        <div><span>Class:<\/span> <strong>${s.cls}<\/strong><\/div>\n        <div><span>Date of Birth:<\/span> <strong>${s.dob || '—'}<\/strong><\/div>\n        <div><span>Student's Name:<\/span> <strong>${s.name}<\/strong><\/div>\n        <div><span>Father's Name:<\/span> <strong>${s.father}<\/strong><\/div>\n        <div><span>Mother's Name:<\/span> <strong>${s.mother || '—'}<\/strong><\/div>\n        <div><span>Exam / Term:<\/span> <strong>${term}<\/strong><\/div>\n      <\/div>\n\n      <table class=\"dmc-table\">\n        <thead>\n          <tr>\n            <th style=\"width:55px;\">S.No<\/th>\n            <th>Subject<\/th>\n            <th>Obtained Marks<\/th>\n            <th>Total Marks<\/th>\n            <th>%<\/th>\n            <th>Grade<\/th>\n          <\/tr>\n        <\/thead>\n        <tbody>\n          ${rowsHtml}\n          <tr class=\"total-row\">\n            <td colspan=\"2\" style=\"text-align:right;\">Total<\/td>\n            <td>${d.total === '' ? '—' : d.total}<\/td>\n            <td>${d.maxTotal}<\/td>\n            <td>${d.pct === '' ? '—' : d.pct.toFixed(2) + '%'}<\/td>\n            <td>${d.grade || '—'}<\/td>\n          <\/tr>\n        <\/tbody>\n      <\/table>\n\n      <div class=\"dmc-summary\">\n        <div>Rank: ${rank}<\/div>\n        <div>Grade: ${d.grade || '—'}<\/div>\n        <div>Overall Percentage: ${d.pct === '' ? '—' : d.pct.toFixed(2) + '%'}<\/div>\n      <\/div>\n\n      <table class=\"grade-legend\">\n        <thead>\n          <tr><th colspan=\"5\">Grading System<\/th><\/tr>\n          <tr><th>80 - 100%<\/th><th>65 - 79%<\/th><th>50 - 64%<\/th><th>33 - 49%<\/th><th>0 - 32%<\/th><\/tr>\n        <\/thead>\n        <tbody>\n          <tr><td><strong>A<\/strong><\/td><td><strong>B<\/strong><\/td><td><strong>C<\/strong><\/td><td><strong>D<\/strong><\/td><td><strong>E<\/strong><\/td><\/tr>\n        <\/tbody>\n      <\/table>\n\n      <div class=\"dmc-sigs\">\n        <div class=\"dmc-sig-slot\">\n          ${sigImages.parents ? `<img src=\"${sigImages.parents}\">` : '<div style=\"height:55px;\"><\/div>'}\n          <div class=\"dmc-sig-line\">Parents<\/div>\n        <\/div>\n        <div class=\"dmc-sig-slot\">\n          ${sigImages.teacher ? `<img src=\"${sigImages.teacher}\">` : '<div style=\"height:55px;\"><\/div>'}\n          <div class=\"dmc-sig-line\">Class Teacher<\/div>\n        <\/div>\n        <div class=\"dmc-sig-slot\">\n          ${sigImages.head ? `<img src=\"${sigImages.head}\">` : '<div style=\"height:55px;\"><\/div>'}\n          <div class=\"dmc-sig-line\">Head Teacher<\/div>\n        <\/div>\n      <\/div>\n    <\/div>`;\n  initDmcDragBoxes();\n}\n\nfunction uploadPhoto(ev) {\n  const file = ev.target.files[0];\n  if (!file) return;\n  const idx = parseInt(document.getElementById('dmcStudentSel').value, 10);\n  const adm = students[idx]?.adm;\n  const reader = new FileReader();\n  reader.onload = e => { studentPhotos[adm] = e.target.result; renderDMC(); };\n  reader.readAsDataURL(file);\n}\n\n// ==================== SIGNATURE PADS ====================\nfunction initSigPad(key) {\n  const canvas = document.getElementById('sig_' + key);\n  const ctx = canvas.getContext('2d');\n  ctx.lineWidth = 2;\n  ctx.lineCap = 'round';\n  ctx.strokeStyle = '#0f172a';\n  let drawing = false;\n\n  const getPos = e => {\n    const r = canvas.getBoundingClientRect();\n    const t = e.touches ? e.touches[0] : e;\n    return { x: (t.clientX - r.left) * (canvas.width / r.width), y: (t.clientY - r.top) * (canvas.height / r.height) };\n  };\n  const start = e => { drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); };\n  const move = e => { if (!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); };\n  const end = () => { if (!drawing) return; drawing = false; sigImages[key] = canvas.toDataURL(); renderDMC(); };\n\n  canvas.addEventListener('mousedown', start);\n  canvas.addEventListener('mousemove', move);\n  window.addEventListener('mouseup', end);\n  canvas.addEventListener('touchstart', start, {passive:false});\n  canvas.addEventListener('touchmove', move, {passive:false});\n  canvas.addEventListener('touchend', end);\n}\n\nfunction clearSig(key) {\n  const c = document.getElementById('sig_' + key);\n  c.getContext('2d').clearRect(0, 0, c.width, c.height);\n  sigImages[key] = '';\n  renderDMC();\n}\n\nfunction uploadSig(ev, key) {\n  const f = ev.target.files[0];\n  if (!f) return;\n  const r = new FileReader();\n  r.onload = e => { sigImages[key] = e.target.result; renderDMC(); };\n  r.readAsDataURL(f);\n}\n\n// ==================== MODALS & BACKUP ====================\nfunction closeModal(id) { document.getElementById(id).classList.remove('open'); }\n\nfunction openSettingsModal() {\n  document.getElementById('set_school').value = settings.school;\n  document.getElementById('set_village').value = settings.village;\n  document.getElementById('set_block').value = settings.block;\n  document.getElementById('set_session').value = settings.session;\n  document.getElementById('settingsModal').classList.add('open');\n}\n\nfunction saveSettings() {\n  settings.school = document.getElementById('set_school').value.trim() || DEFAULT_SETTINGS.school;\n  settings.village = document.getElementById('set_village').value.trim();\n  settings.block = document.getElementById('set_block').value.trim();\n  settings.session = document.getElementById('set_session').value.trim();\n  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));\n  updateTopHeader();\n  closeModal('settingsModal');\n  alert('ਸੈਟਿੰਗ ਸੇਵ ਹੋ ਗਈ ਹੈ!');\n}\n\nfunction openStudentModal(defaultCls, editIdx) {\n  const csel = document.getElementById('stu_cls');\n  csel.innerHTML = CLASSES.map(c => `<option value=\"${c}\">${c}<\/option>`).join('');\n  if (editIdx !== undefined) {\n    const s = students[editIdx];\n    document.getElementById('stuModalTitle').textContent = '✏️ ਵਿਦਿਆਰਥੀ ਡਾਟਾ ਸੋਧੋ';\n    document.getElementById('stu_edit_idx').value = editIdx;\n    csel.value = s.cls;\n    document.getElementById('stu_adm').value = s.adm;\n    document.getElementById('stu_name').value = s.name;\n    document.getElementById('stu_father').value = s.father;\n    document.getElementById('stu_mother').value = s.mother;\n    document.getElementById('stu_dob').value = s.dob;\n  } else {\n    document.getElementById('stuModalTitle').textContent = '➕ ਨਵਾਂ ਵਿਦਿਆਰਥੀ ਜੋੜੋ';\n    document.getElementById('stu_edit_idx').value = '';\n    csel.value = defaultCls || 'LKG';\n    ['stu_adm','stu_name','stu_father','stu_mother','stu_dob'].forEach(id => document.getElementById(id).value = '');\n  }\n  document.getElementById('studentModal').classList.add('open');\n}\n\nfunction saveStudent() {\n  const name = document.getElementById('stu_name').value.trim();\n  if (!name) { alert('ਕਿਰਪਾ ਕਰਕੇ ਵਿਦਿਆਰਥੀ ਦਾ ਨਾਮ ਭਰੋ।'); return; }\n  const editIdx = document.getElementById('stu_edit_idx').value;\n  const obj = {\n    cls: document.getElementById('stu_cls').value,\n    adm: document.getElementById('stu_adm').value.trim(),\n    name,\n    father: document.getElementById('stu_father').value.trim(),\n    mother: document.getElementById('stu_mother').value.trim(),\n    dob: document.getElementById('stu_dob').value.trim()\n  };\n  if (editIdx !== '') {\n    students[Number(editIdx)] = { ...students[Number(editIdx)], ...obj };\n  } else {\n    obj.marks = {};\n    TERMS.forEach(t => obj.marks[t] = { punjabi:'', math:'', english:'', evs:'', hindi:'' });\n    students.push(obj);\n  }\n  persistData();\n  closeModal('studentModal');\n  if (document.getElementById('page-class').classList.contains('active')) renderClassTable();\n}\n\nfunction deleteStudent(idx) {\n  if (!confirm(`ਕੀ ਤੁਸੀਂ ${students[idx].name} ਨੂੰ ਹਟਾਉਣਾ ਚਾਹੁੰਦੇ ਹੋ?`)) return;\n  students.splice(idx, 1);\n  persistData();\n  renderClassTable();\n}\n\nfunction exportBackup() {\n  const blob = new Blob([JSON.stringify({settings, subjects: SUBJECTS, classSubjects, maxMarks, students}, null, 2)], {type: 'application/json'});\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = 'School_Marks_Backup.json';\n  a.click();\n}\n\nfunction importBackup(ev) {\n  const f = ev.target.files[0];\n  if (!f) return;\n  const r = new FileReader();\n  r.onload = e => {\n    try {\n      const obj = JSON.parse(e.target.result);\n      if (Array.isArray(obj.students)) {\n        students = obj.students;\n        if (obj.settings) settings = {...DEFAULT_SETTINGS, ...obj.settings};\n        if (Array.isArray(obj.subjects) && obj.subjects.length) SUBJECTS = obj.subjects;\n        if (obj.classSubjects) classSubjects = obj.classSubjects;\n        if (obj.maxMarks) maxMarks = obj.maxMarks;\n        persistData();\n        persistMaxMarks();\n        persistSubjects();\n        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));\n        updateTopHeader();\n        alert('Backup ਸਫਲਤਾਪੂਰਵਕ Restore ਹੋ ਗਿਆ!');\n      }\n    } catch { alert('ਗਲਤ JSON ਫਾਈਲ!'); }\n  };\n  r.readAsText(f);\n}\n\nfunction resetToExcelData() {\n  if (!confirm('ਕੀ ਤੁਸੀਂ ਸਾਰਾ ਡਾਟਾ ਵਾਪਸ ਅਸਲ Excel ਵਾਲਾ ਕਰਨਾ ਚਾਹੁੰਦੇ ਹੋ?')) return;\n  students = JSON.parse(JSON.stringify(DEFAULT_STUDENTS));\n  settings = {...DEFAULT_SETTINGS};\n  SUBJECTS = JSON.parse(JSON.stringify(DEFAULT_SUBJECTS));\n  classSubjects = createDefaultClassSubjects();\n  maxMarks = createDefaultMaxMarks(20);\n  persistData();\n  persistMaxMarks();\n  persistSubjects();\n  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));\n  updateTopHeader();\n  closeModal('settingsModal');\n  alert('ਅਸਲ Excel ਡਾਟਾ ਰੀਸਟੋਰ ਹੋ ਗਿਆ!');\n}\n\n\n\n// ==================== DMC A4 PORTRAIT ZOOM + DRAG & 4-CORNER RESIZE ====================\nlet dmcScale = 1;\nlet dmcAutoFit = true;\n\nfunction applyDmcZoom() {\n  const sheet = document.getElementById('dmcSheet');\n  const vp = document.getElementById('dmcZoomViewport');\n  const scaleBox = document.getElementById('dmcScaleBox');\n  if (!sheet || !vp || !scaleBox) return;\n\n  if (dmcAutoFit) {\n    const availW = Math.max(240, vp.clientWidth - 8);\n    dmcScale = Math.min(1, availW / DMC_BASE_WIDTH);\n  }\n  const pct = Math.round(dmcScale * 100);\n  const slider = document.getElementById('dmcZoomSlider');\n  const lbl = document.getElementById('dmcZoomPct');\n  if (slider) slider.value = Math.max(30, Math.min(150, pct));\n  if (lbl) lbl.textContent = pct + '%';\n\n  sheet.style.transform = `scale(${dmcScale})`;\n  const scaledW = Math.round(DMC_BASE_WIDTH * dmcScale);\n  const scaledH = Math.round(DMC_BASE_HEIGHT * dmcScale);\n  scaleBox.style.width = scaledW + 'px';\n  scaleBox.style.height = scaledH + 'px';\n  vp.style.justifyContent = scaledW <= vp.clientWidth ? 'center' : 'flex-start';\n}\n\nfunction fitDmcToWidth() {\n  dmcAutoFit = true;\n  applyDmcZoom();\n}\n\nfunction setManualDmcZoom(pctVal) {\n  dmcAutoFit = false;\n  const pct = Math.max(30, Math.min(150, Number(pctVal) || 100));\n  dmcScale = pct / 100;\n  applyDmcZoom();\n}\n\nfunction stepDmcZoom(delta) {\n  const cur = Math.round(dmcScale * 100);\n  setManualDmcZoom(cur + delta);\n}\n\nwindow.addEventListener('resize', () => {\n  if (document.getElementById('page-dmc')?.classList.contains('active') && dmcAutoFit) {\n    applyDmcZoom();\n  }\n});\n\nfunction saveMediaLayout() {\n  try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(mediaLayout)); } catch (e) {}\n}\n\nfunction resetDmcMediaLayout() {\n  mediaLayout = JSON.parse(JSON.stringify(DEFAULT_MEDIA_LAYOUT));\n  saveMediaLayout();\n  renderDMC();\n}\n\nfunction initDmcDragBoxes() {\n  const sheet = document.getElementById('dmcSheet');\n  if (!sheet) return;\n\n  // Apply responsive zoom so mobile fits DMC width without shifting logo/photo\n  requestAnimationFrame(applyDmcZoom);\n\n  // Deselect when clicking on empty sheet area\n  sheet.addEventListener('pointerdown', e => {\n    if (!e.target.closest('.drag-box')) {\n      sheet.querySelectorAll('.drag-box').forEach(b => b.classList.remove('selected'));\n    }\n  });\n\n  ['dragLogoBox', 'dragPhotoBox'].forEach(boxId => {\n    const box = document.getElementById(boxId);\n    if (!box) return;\n    const key = box.dataset.key;\n\n    // 1. Direct file Drag & Drop onto the box\n    box.addEventListener('dragover', e => { e.preventDefault(); box.classList.add('drag-over'); });\n    box.addEventListener('dragleave', () => box.classList.remove('drag-over'));\n    box.addEventListener('drop', e => {\n      e.preventDefault();\n      box.classList.remove('drag-over');\n      const file = e.dataTransfer?.files?.[0];\n      if (!file || !file.type.startsWith('image/')) return;\n      const reader = new FileReader();\n      reader.onload = ev => {\n        if (key === 'logo') {\n          schoolLogo = ev.target.result;\n          try { localStorage.setItem(LOGO_KEY, schoolLogo); } catch (err) {}\n        } else {\n          const idx = parseInt(document.getElementById('dmcStudentSel').value, 10);\n          const adm = students[idx]?.adm;\n          if (adm !== undefined) studentPhotos[adm] = ev.target.result;\n        }\n        renderDMC();\n      };\n      reader.readAsDataURL(file);\n    });\n\n    // 2. Pointer Drag (move) & 4-Corner Resize (scale-compensated!)\n    box.addEventListener('pointerdown', e => {\n      e.preventDefault();\n      e.stopPropagation();\n      sheet.querySelectorAll('.drag-box').forEach(b => b.classList.remove('selected'));\n      box.classList.add('selected');\n\n      const handle = e.target.closest('.rz-handle');\n      const dir = handle ? handle.dataset.dir : null;\n      const startX = e.clientX;\n      const startY = e.clientY;\n      const init = { ...mediaLayout[key] };\n      const minSize = 40;\n      const sheetW = DMC_BASE_WIDTH;\n      const sheetH = DMC_BASE_HEIGHT;\n      const scale = dmcScale || 1;\n\n      const onMove = ev => {\n        const dx = (ev.clientX - startX) / scale;\n        const dy = (ev.clientY - startY) / scale;\n        let { x, y, w, h } = init;\n\n        if (!dir) {\n          // Move / Drag\n          x = Math.max(0, Math.min(sheetW - w, init.x + dx));\n          y = Math.max(0, Math.min(sheetH - h, init.y + dy));\n        } else {\n          // 4-Corner Resize\n          if (dir.includes('e')) {\n            w = Math.max(minSize, Math.min(sheetW - init.x, init.w + dx));\n          }\n          if (dir.includes('s')) {\n            h = Math.max(minSize, Math.min(sheetH - init.y, init.h + dy));\n          }\n          if (dir.includes('w')) {\n            const newW = Math.max(minSize, Math.min(init.x + init.w, init.w - dx));\n            x = init.x + (init.w - newW);\n            w = newW;\n          }\n          if (dir.includes('n')) {\n            const newH = Math.max(minSize, Math.min(init.y + init.h, init.h - dy));\n            y = init.y + (init.h - newH);\n            h = newH;\n          }\n        }\n\n        mediaLayout[key] = { x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h) };\n        box.style.left = mediaLayout[key].x + 'px';\n        box.style.top = mediaLayout[key].y + 'px';\n        box.style.width = mediaLayout[key].w + 'px';\n        box.style.height = mediaLayout[key].h + 'px';\n      };\n\n      const onUp = () => {\n        window.removeEventListener('pointermove', onMove);\n        window.removeEventListener('pointerup', onUp);\n        saveMediaLayout();\n      };\n\n      window.addEventListener('pointermove', onMove);\n      window.addEventListener('pointerup', onUp);\n    });\n  });\n}\n\n// ==================== SCHOOL LOGO UPLOAD ====================\nfunction uploadSchoolLogo(ev) {\n  const file = ev.target.files[0];\n  if (!file) return;\n  const reader = new FileReader();\n  reader.onload = e => {\n    schoolLogo = e.target.result;\n    try { localStorage.setItem(LOGO_KEY, schoolLogo); } catch (err) { /* ignore quota */ }\n    renderDMC();\n  };\n  reader.readAsDataURL(file);\n}\n\nfunction clearSchoolLogo() {\n  schoolLogo = '';\n  localStorage.removeItem(LOGO_KEY);\n  const inp = document.getElementById('schoolLogoInput');\n  if (inp) inp.value = '';\n  renderDMC();\n}\n\n// ==================== TOAST & EXPLICIT SAVE FUNCTIONS ====================\nlet toastTimer = null;\nfunction showToast(msg) {\n  const el = document.getElementById('toastMsg');\n  if (!el) return;\n  el.textContent = msg;\n  el.classList.add('show');\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);\n}\n\nfunction saveMaxMarksExplicit() {\n  persistMaxMarks();\n  persistSubjects();\n  showToast(`✅ Class ${currentMaxClass} ਦੇ Total Marks ਅਤੇ ਸਬਜੈਕਟ ਸੇਵ ਹੋ ਗਏ!`);\n}\n\nfunction saveClassMarksExplicit() {\n  persistData();\n  showToast(`✅ Class ${currentClass} (${currentTerm}) ਦੇ ਸਾਰੇ ਨੰਬਰ ਸੇਵ ਹੋ ਗਏ!`);\n}\n\nfunction saveDmcSettingsExplicit() {\n  saveMediaLayout();\n  try {\n    if (schoolLogo) localStorage.setItem(LOGO_KEY, schoolLogo);\n    localStorage.setItem(SIGS_KEY, JSON.stringify(sigImages));\n  } catch (e) {}\n  showToast('✅ DMC ਸੈਟਿੰਗ (Logo, Signatures ਤੇ ਪੋਜੀਸ਼ਨ) ਸੇਵ ਹੋ ਗਈ!');\n}\n\n// ==================== COLORFUL EXCEL (.xlsx) DOWNLOAD & UPLOAD ====================\nfunction makeCellStyle(fillHex, fontHex = '0F172A', bold = false, align = 'center') {\n  return {\n    fill: { patternType: 'solid', fgColor: { rgb: fillHex } },\n    font: { name: 'Calibri', sz: 11, bold: bold, color: { rgb: fontHex } },\n    alignment: { horizontal: align, vertical: 'center', wrapText: true },\n    border: {\n      top: { style: 'thin', color: { rgb: '94A3B8' } },\n      bottom: { style: 'thin', color: { rgb: '94A3B8' } },\n      left: { style: 'thin', color: { rgb: '94A3B8' } },\n      right: { style: 'thin', color: { rgb: '94A3B8' } }\n    }\n  };\n}\n\nfunction buildStyledClassSheet(stuList, activeSubs, clsForMax) {\n  const headers = ['Class', 'Adm.No', 'Name', 'Father Name', 'Mother Name', 'DOB'];\n  const colTypes = ['info', 'info', 'infoLeft', 'infoLeft', 'infoLeft', 'info'];\n\n  TERMS.forEach((t, ti) => {\n    const tp = `T${ti + 1}`;\n    activeSubs.forEach(sub => {\n      headers.push(`${tp} ${sub.label}`);\n      colTypes.push('mark');\n    });\n    headers.push(`${tp} ਪ੍ਰਾਪਤ (Obt)`);\n    colTypes.push('obt');\n    headers.push(`${tp} ਕੁੱਲ (Out Of)`);\n    colTypes.push('outof');\n    headers.push(`${tp} ਪ੍ਰਤੀਸ਼ਤ (%)`);\n    colTypes.push('pct');\n  });\n\n  // Annual summary columns\n  headers.push('Annual ਪ੍ਰਾਪਤ (Obt)', 'Annual ਕੁੱਲ (Out Of)', 'Annual ਪ੍ਰਤੀਸ਼ਤ (%)', 'Grade');\n  colTypes.push('ann_obt', 'ann_outof', 'ann_pct', 'grade');\n\n  const rows = [headers];\n  stuList.forEach(s => {\n    const row = [s.cls, s.adm, s.name, s.father, s.mother, s.dob];\n    TERMS.forEach(t => {\n      const d = getStudentTermData(s, t);\n      activeSubs.forEach(sub => {\n        const v = s.marks?.[t]?.[sub.key];\n        row.push(v === undefined || v === null ? '' : v);\n      });\n      row.push(d.hasAny ? d.total : '');\n      row.push(d.maxTotal);\n      row.push(d.hasAny && d.pct !== '' ? Number(d.pct.toFixed(2)) : '');\n    });\n    const ann = getStudentTermData(s, 'Annual');\n    row.push(ann.hasAny ? ann.total : '');\n    row.push(ann.maxTotal);\n    row.push(ann.hasAny && ann.pct !== '' ? Number(ann.pct.toFixed(2)) : '');\n    row.push(ann.grade || '');\n    rows.push(row);\n  });\n\n  const ws = XLSX.utils.aoa_to_sheet(rows);\n\n  // Styles palette\n  const styles = {\n    hdr_default: makeCellStyle('155787', 'FFFFFF', true, 'center'),\n    hdr_obt:     makeCellStyle('047857', 'FFFFFF', true, 'center'), // Emerald Green Header\n    hdr_outof:   makeCellStyle('1D4ED8', 'FFFFFF', true, 'center'), // Royal Blue Header\n    hdr_pct:     makeCellStyle('B45309', 'FFFFFF', true, 'center'), // Amber/Orange Header\n    hdr_ann_obt: makeCellStyle('065F46', 'FFFFFF', true, 'center'),\n    hdr_ann_out: makeCellStyle('1E3A8A', 'FFFFFF', true, 'center'),\n    hdr_ann_pct: makeCellStyle('9A3412', 'FFFFFF', true, 'center'),\n    hdr_grade:   makeCellStyle('6D28D9', 'FFFFFF', true, 'center'), // Purple Header\n\n    info:        makeCellStyle('FFFFFF', '1E293B', false, 'center'),\n    infoLeft:    makeCellStyle('FFFFFF', '1E293B', false, 'left'),\n    mark:        makeCellStyle('F8FAFC', '0F172A', false, 'center'),\n    obt:         makeCellStyle('D1FAE5', '065F46', true, 'center'), // Light Green\n    outof:       makeCellStyle('DBEAFE', '1E40AF', true, 'center'), // Light Blue\n    pct:         makeCellStyle('FEF3C7', '92400E', true, 'center'), // Light Gold/Yellow\n    ann_obt:     makeCellStyle('A7F3D0', '064E3B', true, 'center'), // Rich Mint\n    ann_outof:   makeCellStyle('BFDBFE', '1E3A8A', true, 'center'), // Rich Sky Blue\n    ann_pct:     makeCellStyle('FDE68A', '78350F', true, 'center'), // Rich Gold\n    grade:       makeCellStyle('EDE9FE', '5B21B6', true, 'center')  // Soft Lavender\n  };\n\n  const range = XLSX.utils.decode_range(ws['!ref']);\n  for (let R = range.s.r; R <= range.e.r; R++) {\n    for (let C = range.s.c; C <= range.e.c; C++) {\n      const addr = XLSX.utils.encode_cell({ r: R, c: C });\n      if (!ws[addr]) ws[addr] = { t: 's', v: '' };\n      const ct = colTypes[C] || 'info';\n      if (R === 0) {\n        if (ct === 'obt') ws[addr].s = styles.hdr_obt;\n        else if (ct === 'outof') ws[addr].s = styles.hdr_outof;\n        else if (ct === 'pct') ws[addr].s = styles.hdr_pct;\n        else if (ct === 'ann_obt') ws[addr].s = styles.hdr_ann_obt;\n        else if (ct === 'ann_outof') ws[addr].s = styles.hdr_ann_out;\n        else if (ct === 'ann_pct') ws[addr].s = styles.hdr_ann_pct;\n        else if (ct === 'grade') ws[addr].s = styles.hdr_grade;\n        else ws[addr].s = styles.hdr_default;\n      } else {\n        ws[addr].s = styles[ct] || styles.info;\n        if ((ct === 'pct' || ct === 'ann_pct') && typeof ws[addr].v === 'number') {\n          ws[addr].z = '0.00\"%\"';\n        }\n      }\n    }\n  }\n\n  // Column widths\n  ws['!cols'] = headers.map((h, i) => {\n    if (i === 2 || i === 3 || i === 4) return { wch: 20 };\n    if (i === 5) return { wch: 13 };\n    if (colTypes[i] === 'obt' || colTypes[i] === 'outof' || colTypes[i] === 'pct' || colTypes[i].startsWith('ann_')) return { wch: 16 };\n    return { wch: 12 };\n  });\n  ws['!rows'] = [{ hpt: 28 }];\n  return ws;\n}\n\nfunction buildSetOutOfTotalMarksSheet() {\n  const rows = [];\n  const meta = []; // track row styling type\n\n  rows.push([`${settings.school}, ${settings.village} (${settings.block}) — Set Out of Total Marks`]);\n  meta.push('title');\n  rows.push([`Session: ${settings.session}`]);\n  meta.push('subtitle');\n  rows.push([]);\n  meta.push('blank');\n\n  CLASSES.forEach(cls => {\n    const activeSubs = getClassSubjects(cls);\n    const activeNames = activeSubs.map(s => s.label).join(', ');\n    rows.push([`Class: ${cls}`, `Assigned Subjects: ${activeNames || 'None'}`]);\n    meta.push('clsTitle');\n\n    const hdr = ['Class', 'Term', ...SUBJECTS.map(s => s.label), 'Term Total (Out Of)'];\n    rows.push(hdr);\n    meta.push('hdr');\n\n    TERMS.forEach(t => {\n      const r = [cls, t];\n      SUBJECTS.forEach(s => {\n        const isAssigned = activeSubs.some(a => a.key === s.key);\n        r.push(isAssigned ? getSubjectMax(cls, t, s.key) : 'N/A');\n      });\n      r.push(getTermTotalMax(cls, t));\n      rows.push(r);\n      meta.push('data');\n    });\n\n    const annRow = [cls, 'Annual Total'];\n    SUBJECTS.forEach(s => {\n      const isAssigned = activeSubs.some(a => a.key === s.key);\n      annRow.push(isAssigned ? getSubjectMax(cls, 'Annual', s.key) : 'N/A');\n    });\n    annRow.push(getTermTotalMax(cls, 'Annual'));\n    rows.push(annRow);\n    meta.push('total');\n\n    rows.push([]);\n    meta.push('blank');\n  });\n\n  const ws = XLSX.utils.aoa_to_sheet(rows);\n  const stTitle = makeCellStyle('730362', 'FFFFFF', true, 'left');\n  const stSub   = makeCellStyle('F3E8FF', '581C87', true, 'left');\n  const stCls   = makeCellStyle('037312', 'FFFFFF', true, 'left');\n  const stHdr   = makeCellStyle('155787', 'FFFFFF', true, 'center');\n  const stData  = makeCellStyle('FFFFFF', '0F172A', false, 'center');\n  const stNA    = makeCellStyle('F1F5F9', '94A3B8', false, 'center');\n  const stOut   = makeCellStyle('DBEAFE', '1E40AF', true, 'center');\n  const stTot   = makeCellStyle('FEF3C7', '92400E', true, 'center');\n\n  const maxCols = SUBJECTS.length + 3;\n  const range = XLSX.utils.decode_range(ws['!ref']);\n  for (let R = range.s.r; R <= range.e.r; R++) {\n    const rt = meta[R];\n    if (rt === 'blank') continue;\n    for (let C = 0; C < maxCols; C++) {\n      const addr = XLSX.utils.encode_cell({ r: R, c: C });\n      if (!ws[addr]) ws[addr] = { t: 's', v: '' };\n      if (rt === 'title') ws[addr].s = stTitle;\n      else if (rt === 'subtitle') ws[addr].s = stSub;\n      else if (rt === 'clsTitle') ws[addr].s = stCls;\n      else if (rt === 'hdr') ws[addr].s = (C === maxCols - 1) ? makeCellStyle('1D4ED8', 'FFFFFF', true, 'center') : stHdr;\n      else if (rt === 'total') ws[addr].s = stTot;\n      else if (rt === 'data') {\n        if (C === maxCols - 1) ws[addr].s = stOut;\n        else if (ws[addr].v === 'N/A') ws[addr].s = stNA;\n        else ws[addr].s = stData;\n      }\n    }\n  }\n\n  ws['!cols'] = [{ wch: 12 }, { wch: 18 }, ...SUBJECTS.map(() => ({ wch: 13 })), { wch: 20 }];\n  return ws;\n}\n\nfunction downloadExcelWorkbook() {\n  if (typeof XLSX !== 'undefined') {\n    const wb = XLSX.utils.book_new();\n    // 1. All_Students sheet (all configured subjects + obtained, out of, percentage, grade)\n    const allWs = buildStyledClassSheet(students, SUBJECTS, null);\n    XLSX.utils.book_append_sheet(wb, allWs, 'All_Students');\n\n    // 2. Class-wise sheets (each class uses its own assigned subjects & out of total marks!)\n    CLASSES.forEach(cls => {\n      const clsList = students.filter(s => s.cls === cls);\n      const clsSubs = getClassSubjects(cls);\n      const ws = buildStyledClassSheet(clsList, clsSubs, cls);\n      XLSX.utils.book_append_sheet(wb, ws, cls);\n    });\n\n    // 3. Last sheet: Set Out of Total Marks\n    const mmWs = buildSetOutOfTotalMarksSheet();\n    XLSX.utils.book_append_sheet(wb, mmWs, 'Set Out of Total Marks');\n\n    XLSX.writeFile(wb, 'School_Marks_Data.xlsx');\n    showToast('📥 ਰੰਗ-ਬਰੰਗੀ Excel ਫਾਈਲ (Set Out of Total Marks ਸ਼ੀਟ ਸਮੇਤ) ਡਾਊਨਲੋਡ ਹੋ ਗਈ!');\n  } else {\n    // Offline fallback: download CSV\n    const headers = ['Class', 'Adm.No', 'Name', 'Father Name', 'Mother Name', 'DOB'];\n    TERMS.forEach((t, ti) => {\n      SUBJECTS.forEach(sub => headers.push(`T${ti+1} ${sub.label}`));\n      headers.push(`T${ti+1} Obt`, `T${ti+1} Out Of`, `T${ti+1} %`);\n    });\n    headers.push('Annual Obt', 'Annual Out Of', 'Annual %', 'Grade');\n    const rows = [headers];\n    students.forEach(s => {\n      const row = [s.cls, s.adm, s.name, s.father, s.mother, s.dob];\n      TERMS.forEach(t => {\n        const d = getStudentTermData(s, t);\n        SUBJECTS.forEach(sub => row.push(s.marks?.[t]?.[sub.key] ?? ''));\n        row.push(d.hasAny ? d.total : '', d.maxTotal, d.hasAny && d.pct !== '' ? d.pct.toFixed(2) : '');\n      });\n      const ann = getStudentTermData(s, 'Annual');\n      row.push(ann.hasAny ? ann.total : '', ann.maxTotal, ann.hasAny && ann.pct !== '' ? ann.pct.toFixed(2) : '', ann.grade || '');\n      rows.push(row);\n    });\n    const csv = rows.map(r => r.map(v => `\"${String(v).replace(/\"/g, '\"\"')}\"`).join(',')).join('\\n');\n    const blob = new Blob(['\\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(blob);\n    a.download = 'School_Marks_Data.csv';\n    a.click();\n    alert('ਇੰਟਰਨੈੱਟ ਬੰਦ ਹੋਣ ਕਾਰਨ CSV ਫਾਈਲ ਡਾਊਨਲੋਡ ਕੀਤੀ ਗਈ ਹੈ — ਰੰਗ-ਬਰੰਗੀ .xlsx ਫਾਈਲ ਲਈ ਇੰਟਰਨੈੱਟ ਚਾਲੂ ਰੱਖੋ।');\n  }\n}\n\nfunction normalizeClassName(val, fallbackSheet) {\n  const s = String(val || '').trim();\n  const map = { 'lkg':'LKG', 'ukg':'UKG', '1st':'1st', '1':'1st', '2nd':'2nd', '2':'2nd', '3rd':'3rd', '3':'3rd', '4th':'4th', '4':'4th', '5th':'5th', '5':'5th' };\n  if (map[s.toLowerCase()]) return map[s.toLowerCase()];\n  if (fallbackSheet && map[fallbackSheet.toLowerCase()]) return map[fallbackSheet.toLowerCase()];\n  return s || fallbackSheet || 'LKG';\n}\n\nfunction parseMarksVal(v) {\n  if (v === undefined || v === null || String(v).trim() === '') return '';\n  const n = Number(v);\n  return isNaN(n) ? '' : n;\n}\n\nfunction parseSheetRows(aoa, sheetName) {\n  if (!aoa || aoa.length < 2) return [];\n  let hdrIdx = -1;\n  for (let r = 0; r < Math.min(5, aoa.length); r++) {\n    const joined = (aoa[r] || []).map(x => String(x || '').toLowerCase().trim()).join('|');\n    if (joined.includes('name') && (joined.includes('punjabi') || joined.includes('adm') || joined.includes('class'))) {\n      hdrIdx = r;\n      break;\n    }\n  }\n  if (hdrIdx === -1) return [];\n\n  const hdr = aoa[hdrIdx].map(x => String(x || '').trim());\n  const hdrLow = hdr.map(x => x.toLowerCase());\n  const isExportedFormat = hdrLow.some(h => /^t1\\s+/.test(h));\n\n  const findCol = (...keys) => {\n    for (const k of keys) {\n      const idx = hdrLow.findIndex(h => h === k || h.includes(k));\n      if (idx !== -1) return idx;\n    }\n    return -1;\n  };\n\n  const colCls = findCol('class');\n  const colAdm = findCol('adm.no', 'adm no', 'adm.no.', 'regi', 'adm');\n  let colName = hdrLow.findIndex(h => h === 'name' || h === 'student name');\n  if (colName === -1) colName = findCol('name');\n  const colFather = findCol('father name', 'fathername', 'father');\n  const colMother = findCol('mother name', \"mother's name\", 'mother');\n  const colDob = findCol('dob', 'date of birth');\n\n  const termColMap = {};\n  TERMS.forEach(t => termColMap[t] = {});\n\n  if (isExportedFormat) {\n    TERMS.forEach((t, ti) => {\n      const prefix = `t${ti + 1} `;\n      SUBJECTS.forEach(sub => {\n        const subLow = sub.label.toLowerCase();\n        const idx = hdrLow.findIndex(h =>\n          h === prefix + sub.key ||\n          h === prefix + subLow ||\n          (h.startsWith(prefix) && (h.includes(sub.key) || h.includes(subLow)) && !h.includes('obt') && !h.includes('out') && !h.includes('%') && !h.includes('ਪ੍ਰਾਪਤ') && !h.includes('ਕੁੱਲ') && !h.includes('ਪ੍ਰਤੀਸ਼ਤ'))\n        );\n        if (idx !== -1) termColMap[t][sub.key] = idx;\n      });\n    });\n  } else {\n    SUBJECTS.forEach(sub => {\n      const subLow = sub.label.toLowerCase();\n      let occ = 0;\n      hdrLow.forEach((h, idx) => {\n        if ((h.startsWith(sub.key) || h.startsWith(subLow)) && !h.includes('total') && occ < 5) {\n          termColMap[TERMS[occ]][sub.key] = idx;\n          occ++;\n        }\n      });\n    });\n  }\n\n  const parsed = [];\n  for (let r = hdrIdx + 1; r < aoa.length; r++) {\n    const row = aoa[r];\n    if (!row) continue;\n    const name = colName !== -1 ? String(row[colName] || '').trim() : '';\n    if (!name) continue;\n    const cls = normalizeClassName(colCls !== -1 ? row[colCls] : '', sheetName);\n    const adm = colAdm !== -1 ? String(row[colAdm] || '').trim() : '';\n    const father = colFather !== -1 ? String(row[colFather] || '').trim() : '';\n    const mother = colMother !== -1 ? String(row[colMother] || '').trim() : '';\n    const dob = colDob !== -1 ? String(row[colDob] || '').trim() : '';\n    const marks = {};\n    TERMS.forEach(t => {\n      marks[t] = {};\n      SUBJECTS.forEach(sub => {\n        const ci = termColMap[t][sub.key];\n        marks[t][sub.key] = (ci !== undefined && ci !== -1) ? parseMarksVal(row[ci]) : '';\n      });\n    });\n    parsed.push({ cls, adm, name, father, mother, dob, marks });\n  }\n  return parsed;\n}\n\nfunction parseSetOutOfTotalMarksSheet(aoa) {\n  if (!aoa || !aoa.length) return false;\n  let updated = false;\n  let currentHdr = null;\n  for (let r = 0; r < aoa.length; r++) {\n    const row = aoa[r] || [];\n    const c0 = String(row[0] || '').trim();\n    const c1 = String(row[1] || '').trim();\n    if (c0.toLowerCase() === 'class' && c1.toLowerCase() === 'term') {\n      currentHdr = row.map(x => String(x || '').trim().toLowerCase());\n      continue;\n    }\n    if (currentHdr && CLASSES.includes(c0) && TERMS.includes(c1)) {\n      SUBJECTS.forEach(sub => {\n        const idx = currentHdr.findIndex(h => h === sub.label.toLowerCase() || h === sub.key);\n        if (idx !== -1) {\n          const val = String(row[idx] ?? '').trim();\n          if (val !== '' && val.toUpperCase() !== 'N/A' && !isNaN(Number(val))) {\n            if (!maxMarks[c0]) maxMarks[c0] = {};\n            if (!maxMarks[c0][c1]) maxMarks[c0][c1] = {};\n            maxMarks[c0][c1][sub.key] = Number(val);\n            updated = true;\n          }\n        }\n      });\n    }\n  }\n  return updated;\n}\n\nfunction parseSimpleCSV(text) {\n  const rows = [];\n  let cur = '', inQ = false, row = [];\n  for (let i = 0; i < text.length; i++) {\n    const ch = text[i], nxt = text[i + 1];\n    if (ch === '\"') {\n      if (inQ && nxt === '\"') { cur += '\"'; i++; }\n      else inQ = !inQ;\n    } else if (ch === ',' && !inQ) {\n      row.push(cur); cur = '';\n    } else if ((ch === '\\n' || ch === '\\r') && !inQ) {\n      if (ch === '\\r' && nxt === '\\n') i++;\n      row.push(cur); rows.push(row); row = []; cur = '';\n    } else {\n      cur += ch;\n    }\n  }\n  if (cur.length || row.length) { row.push(cur); rows.push(row); }\n  return rows;\n}\n\nfunction uploadExcelWorkbook(ev) {\n  const file = ev.target.files[0];\n  if (!file) return;\n  const fname = file.name.toLowerCase();\n\n  const applyImported = (newList, mmImported) => {\n    if (!newList.length) {\n      alert('⚠️ ਫਾਈਲ ਵਿੱਚ ਕੋਈ ਵਿਦਿਆਰਥੀ ਡਾਟਾ ਨਹੀਂ ਮਿਲਿਆ। ਕਿਰਪਾ ਕਰਕੇ ਸਹੀ Excel/CSV ਫਾਈਲ ਚੁਣੋ।');\n      return;\n    }\n    if (!confirm(`ਫਾਈਲ ਵਿੱਚੋਂ ${newList.length} ਵਿਦਿਆਰਥੀ ਮਿਲੇ ਹਨ। ਕੀ ਤੁਸੀਂ ਮੌਜੂਦਾ ਡਾਟਾ ਨੂੰ ਇਸ ਨਾਲ ਬਦਲਣਾ (Replace) ਚਾਹੁੰਦੇ ਹੋ?`)) return;\n    students = newList;\n    persistData();\n    if (mmImported) persistMaxMarks();\n    if (document.getElementById('page-class').classList.contains('active')) renderClassTable();\n    if (document.getElementById('page-print').classList.contains('active')) renderPrintTable();\n    if (document.getElementById('page-dmc').classList.contains('active')) populateDmcStudents();\n    if (document.getElementById('page-maxmarks').classList.contains('active')) renderMaxMarksTable();\n    showToast(`✅ ${newList.length} ਵਿਦਿਆਰਥੀਆਂ ਦਾ ਡਾਟਾ ਸਫਲਤਾਪੂਰਵਕ ਅਪਲੋਡ ਹੋ ਗਿਆ!`);\n  };\n\n  if (fname.endsWith('.csv')) {\n    const reader = new FileReader();\n    reader.onload = e => {\n      const aoa = parseSimpleCSV(e.target.result.replace(/^\\uFEFF/, ''));\n      applyImported(parseSheetRows(aoa, ''), false);\n    };\n    reader.readAsText(file);\n  } else {\n    if (typeof XLSX === 'undefined') {\n      alert('⚠️ .xlsx ਫਾਈਲ ਪੜ੍ਹਨ ਲਈ ਇੰਟਰਨੈੱਟ ਕਨੈਕਸ਼ਨ ਚਾਹੀਦਾ ਹੈ (ਜਾਂ Excel ਵਿੱਚ File -> Save As -> CSV ਕਰਕੇ ਅਪਲੋਡ ਕਰੋ)।');\n      ev.target.value = '';\n      return;\n    }\n    const reader = new FileReader();\n    reader.onload = e => {\n      try {\n        const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });\n        let mmImported = false;\n        const mmSheetName = wb.SheetNames.find(n => n.toLowerCase().includes('set out of total'));\n        if (mmSheetName) {\n          const mmAoa = XLSX.utils.sheet_to_json(wb.Sheets[mmSheetName], { header: 1, raw: false });\n          mmImported = parseSetOutOfTotalMarksSheet(mmAoa);\n        }\n\n        let collected = [];\n        const classSheets = wb.SheetNames.filter(n => CLASSES.map(c => c.toLowerCase()).includes(n.toLowerCase()));\n        if (classSheets.length > 0) {\n          classSheets.forEach(sn => {\n            const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: false });\n            collected = collected.concat(parseSheetRows(aoa, sn));\n          });\n        } else {\n          const first = wb.SheetNames[0];\n          const aoa = XLSX.utils.sheet_to_json(wb.Sheets[first], { header: 1, raw: false });\n          collected = parseSheetRows(aoa, first);\n        }\n        applyImported(collected, mmImported);\n      } catch (err) {\n        alert('❌ Excel ਫਾਈਲ ਪੜ੍ਹਨ ਵਿੱਚ ਗਲਤੀ ਆਈ: ' + err.message);\n      }\n    };\n    reader.readAsArrayBuffer(file);\n  }\n  ev.target.value = '';\n}\n\nwindow.addEventListener('DOMContentLoaded', () => {\n  loadData();\n  ['parents','teacher','head'].forEach(initSigPad);\n});\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "builtin_family", "name": "ਰਾਜ ਕੁਮਾਰ ਰਿਸ਼ਤੇਦਾਰ ਵੇਰਵਾ", "filename": "ਰਾਜ ਕੁਮਾਰ ਰਿਸ਼ਤੇਦਾਰ ਵੇਰਵਾ.html", "path": "ਰਾਜ ਕੁਮਾਰ ਰਿਸ਼ਤੇਦਾਰ ਵੇਰਵਾ.html", "builtin": true, "content": "<!DOCTYPE html>\n<html lang=\"pa\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Family Tree (Raj Kumar)<\/title>\n\n    <\!-- Google Fonts: Noto Sans Gurmukhi for crisp Punjabi rendering + Inter for Latin UI -->\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\n    <\!-- Tailwind CSS CDN -->\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <\!-- SheetJS for real .xlsx Excel export with Gurmukhi Unicode support -->\n    <script src=\"https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js\"><\/script>\n    <script>\n        tailwind.config = {\n            theme: {\n                extend: {\n                    fontFamily: {\n                        sans: ['\"Noto Sans Gurmukhi\"', 'Inter', 'system-ui', 'sans-serif'],\n                    },\n                    colors: {\n                        appBlue: '#155787',\n                        appBlueDark: '#0f4166',\n                        appRed: '#99091f',\n                        appRedDark: '#7a0718',\n                        appHomeRed: '#bf0a0a',\n                        appTealText: '#0e5e55',\n                        appBg: '#f5f5f5',\n                    }\n                }\n            }\n        }\n    <\/script>\n<\/head>\n<body class=\"bg-slate-200 min-h-screen font-sans text-[#0e5e55] antialiased selection:bg-[#155787] selection:text-white\">\n\n    <\!-- Mobile-First Responsive App Shell (max-width 560px centered on desktop, full width on mobile) -->\n    <div id=\"app-shell\" class=\"max-w-[560px] mx-auto min-h-screen bg-[#f5f5f5] shadow-xl flex flex-col relative\">\n\n        <\!-- Sticky Top Header Bar -->\n        <header id=\"app-header\" class=\"sticky top-0 z-30 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between shadow-sm\">\n            <div class=\"flex items-center gap-3 min-w-0\">\n                <button id=\"header-back-btn\" onclick=\"navigateHome()\" class=\"hidden p-2 -ml-2 rounded-lg text-[#155787] hover:bg-gray-100 active:bg-gray-200 transition-colors\" aria-label=\"Back to Home\" title=\"ਮੁੱਖ ਪੰਨਾ (Home)\">\n                    <svg class=\"w-6 h-6\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\n                        <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.2\" d=\"M15 19l-7-7 7-7\" />\n                    <\/svg>\n                <\/button>\n                <div id=\"header-home-icon\" class=\"w-8 h-8 rounded-lg bg-[#155787] text-white flex items-center justify-center shrink-0 shadow-sm\">\n                    <svg class=\"w-5 h-5\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\n                        <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z\" />\n                    <\/svg>\n                <\/div>\n                <h1 id=\"header-title\" class=\"text-lg sm:text-xl font-semibold text-[#2c3e50] truncate\">\n                    Family Tree (Raj Kumar)\n                <\/h1>\n            <\/div>\n            <div class=\"flex items-center gap-1.5 shrink-0\">\n                <div id=\"header-right-actions\" class=\"flex items-center gap-1\">\n                    <\!-- Dynamic header action button injected via JS -->\n                <\/div>\n                <\!-- Compact Icon-Only Excel Download Button (Zero visible text) -->\n                <button\n                    id=\"excel-download-btn\"\n                    type=\"button\"\n                    onclick=\"exportDataExcel()\"\n                    aria-label=\"Download Excel\"\n                    title=\"Download Excel (.xlsx)\"\n                    class=\"p-1.5 rounded-lg hover:bg-emerald-50 active:scale-95 transition-all flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-[#1D6F42]/40\">\n                    <svg class=\"w-6 h-6\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n                        <\!-- Right Spreadsheet Sheet -->\n                        <rect x=\"8\" y=\"3\" width=\"14\" height=\"18\" rx=\"2\" fill=\"#21A366\"/>\n                        <rect x=\"14\" y=\"3\" width=\"8\" height=\"6\" rx=\"1\" fill=\"#33C481\"/>\n                        <rect x=\"14\" y=\"9\" width=\"8\" height=\"6\" fill=\"#107C41\"/>\n                        <rect x=\"14\" y=\"15\" width=\"8\" height=\"6\" rx=\"1\" fill=\"#185C37\"/>\n                        <\!-- Subtle Grid Lines -->\n                        <line x1=\"8\" y1=\"9\" x2=\"22\" y2=\"9\" stroke=\"#ffffff\" stroke-opacity=\"0.35\" stroke-width=\"0.75\"/>\n                        <line x1=\"8\" y1=\"15\" x2=\"22\" y2=\"15\" stroke=\"#ffffff\" stroke-opacity=\"0.35\" stroke-width=\"0.75\"/>\n                        <line x1=\"14\" y1=\"3\" x2=\"14\" y2=\"21\" stroke=\"#ffffff\" stroke-opacity=\"0.35\" stroke-width=\"0.75\"/>\n                        <\!-- Left Dark-Green Excel Badge -->\n                        <rect x=\"2\" y=\"6\" width=\"12\" height=\"12\" rx=\"2\" fill=\"#1D6F42\"/>\n                        <\!-- Crisp White X Symbol -->\n                        <path d=\"M5.4 8.8L8 12L5.4 15.2H7.2L8.9 13.05L10.6 15.2H12.4L9.8 12L12.4 8.8H10.6L8.9 10.95L7.2 8.8H5.4Z\" fill=\"#FFFFFF\"/>\n                    <\/svg>\n                <\/button>\n            <\/div>\n        <\/header>\n\n        <\!-- Main Dynamic Content Container -->\n        <main id=\"app-content\" class=\"flex-1 p-3 sm:p-4 pb-8\">\n            <\!-- Views are dynamically rendered here -->\n        <\/main>\n\n        <\!-- Subtle Footer -->\n        <footer class=\"py-3 px-4 text-center text-xs text-gray-500 border-t border-gray-200 bg-white\">\n            Family Tree (Raj Kumar) • ਡਾਟਾ ਤੁਹਾਡੇ ਬ੍ਰਾਊਜ਼ਰ ਵਿੱਚ ਸੁਰੱਖਿਅਤ ਰਹਿੰਦਾ ਹੈ\n        <\/footer>\n    <\/div>\n\n    <\!-- Row Detail Modal -->\n    <div id=\"detail-modal\" class=\"fixed inset-0 z-50 hidden items-center justify-center bg-black/55 backdrop-blur-[1px] p-4\" role=\"dialog\" aria-modal=\"true\">\n        <div class=\"bg-white w-full max-w-[480px] rounded-xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]\">\n            <div class=\"bg-[#155787] text-white px-4 py-3.5 flex items-center justify-between\">\n                <div class=\"min-w-0 pr-2\">\n                    <p id=\"detail-modal-subtitle\" class=\"text-xs text-blue-100 truncate\"><\/p>\n                    <h2 id=\"detail-modal-title\" class=\"text-lg font-bold truncate\">ਪਰਿਵਾਰਕ ਵੇਰਵਾ<\/h2>\n                <\/div>\n                <button onclick=\"closeDetailModal()\" class=\"p-1.5 rounded-lg hover:bg-white/15 active:bg-white/25 transition-colors\" aria-label=\"Close modal\">\n                    <svg class=\"w-6 h-6\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\n                        <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M6 18L18 6M6 6l12 12\" />\n                    <\/svg>\n                <\/button>\n            <\/div>\n            <div id=\"detail-modal-body\" class=\"p-4 overflow-y-auto space-y-2.5 bg-[#f5f5f5]\">\n                <\!-- Dynamic vertical list of fields -->\n            <\/div>\n            <div class=\"p-3 bg-white border-t border-gray-200 flex items-center justify-between gap-2\">\n                <button onclick=\"copyDetailModalText()\" class=\"flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-sm font-medium bg-gray-100 text-[#155787] hover:bg-gray-200 transition-colors\">\n                    <svg class=\"w-4 h-4\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\n                        <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z\" />\n
