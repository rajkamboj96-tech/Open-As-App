                       appData = parsed;\n                        return;\n                    }\n                }\n            } catch (err) {\n                console.error('Failed to read from localStorage:', err);\n            }\n            appData = deepClone(DEFAULT_DATA);\n        }\n\n        /**\n         * Save current appData to localStorage\n         */\n        function saveData(showNotification = false, customMsg = 'ਡਾਟਾ ਸਫਲਤਾਪੂਰਵਕ ਸੇਵ ਹੋ ਗਿਆ!') {\n            try {\n                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));\n                if (showNotification) {\n                    showToast(customMsg, 'success');\n                }\n                return true;\n            } catch (err) {\n                console.error('Failed to save to localStorage:', err);\n                showToast('ਡਾਟਾ ਸੇਵ ਕਰਨ ਵਿੱਚ ਗਲਤੀ ਆਈ!', 'error');\n                return false;\n            }\n        }\n\n        /**\n         * Escape HTML entities to prevent XSS when rendering user-edited text\n         */\n        function escapeHtml(str) {\n            if (str === null || str === undefined) return '';\n            return String(str)\n                .replace(/&/g, '&amp;')\n                .replace(/<\/g, '&lt;')\n                .replace(/>/g, '&gt;')\n                .replace(/\"/g, '&quot;')\n                .replace(/'/g, '&#39;');\n        }\n\n        /**\n         * Find village object by id\n         */\n        function getVillageById(id) {\n            return appData.find(v => v.id === id) || null;\n        }\n\n        /**\n         * Show a toast notification\n         */\n        function showToast(message, type = 'success') {\n            const toast = document.getElementById('toast');\n            toast.textContent = message;\n            toast.className = `fixed bottom-5 left-1/2 -translate-x-1/2 z-50 max-w-[90vw] px-4 py-2.5 rounded-lg shadow-xl text-sm font-semibold text-white transition-all duration-300 ${\n                type === 'error' ? 'bg-[#99091f]' : 'bg-[#0e5e55]'\n            }`;\n            toast.classList.remove('hidden');\n\n            if (toastTimer) clearTimeout(toastTimer);\n            toastTimer = setTimeout(() => {\n                toast.classList.add('hidden');\n            }, 2800);\n        }\n\n        /**\n         * ============================================================================\n         * 3. NAVIGATION FUNCTIONS\n         * ============================================================================\n         */\n        function navigateHome() {\n            state.screen = 'home';\n            state.villageId = null;\n            state.selectedRowIndex = null;\n            state.highlightRowIndex = null;\n            render();\n            window.scrollTo({ top: 0, behavior: 'smooth' });\n        }\n\n        function openVillage(villageId, familyIdx = 0, highlightRow = null) {\n            const village = getVillageById(villageId);\n            if (!village) return;\n            state.screen = 'village';\n            state.villageId = villageId;\n            state.familyIndex = Math.min(Math.max(0, familyIdx), Math.max(0, village.families.length - 1));\n            state.selectedRowIndex = highlightRow;\n            state.highlightRowIndex = highlightRow;\n            render();\n            window.scrollTo({ top: 0, behavior: 'smooth' });\n        }\n\n        function openEditMenu() {\n            state.screen = 'edit-menu';\n            state.villageId = null;\n            render();\n            window.scrollTo({ top: 0, behavior: 'smooth' });\n        }\n\n        function openEditVillage(villageId, familyIdx = 0) {\n            const village = getVillageById(villageId);\n            if (!village) return;\n            state.screen = 'edit-village';\n            state.villageId = villageId;\n            state.editFamilyIndex = Math.min(Math.max(0, familyIdx), Math.max(0, village.families.length - 1));\n            render();\n            window.scrollTo({ top: 0, behavior: 'smooth' });\n        }\n\n        /**\n         * ============================================================================\n         * 4. MAIN RENDER CONTROLLER\n         * ============================================================================\n         */\n        function render() {\n            const headerTitle = document.getElementById('header-title');\n            const headerBackBtn = document.getElementById('header-back-btn');\n            const headerHomeIcon = document.getElementById('header-home-icon');\n            const headerRight = document.getElementById('header-right-actions');\n            const content = document.getElementById('app-content');\n\n            headerRight.innerHTML = '';\n\n            if (state.screen === 'home') {\n                headerTitle.textContent = 'Family Tree (Raj Kumar)';\n                headerBackBtn.classList.add('hidden');\n                headerHomeIcon.classList.remove('hidden');\n                content.innerHTML = renderHomeScreen();\n                attachHomeSearchListener();\n            } else if (state.screen === 'village') {\n                const village = getVillageById(state.villageId);\n                headerTitle.textContent = village ? village.caption : 'ਪਿੰਡ';\n                headerBackBtn.classList.remove('hidden');\n                headerHomeIcon.classList.add('hidden');\n                headerRight.innerHTML = `\n                    <button onclick=\"openEditVillage('${escapeHtml(state.villageId)}', ${state.familyIndex})\"\n                        class=\"px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-[#99091f]/10 text-[#99091f] hover:bg-[#99091f] hover:text-white transition-colors\"\n                        title=\"ਇਸ ਪਿੰਡ ਦਾ ਡਾਟਾ ਐਡਿਟ ਕਰੋ\">\n                        Edit\n                    <\/button>\n                `;\n                content.innerHTML = renderVillageScreen(village);\n            } else if (state.screen === 'edit-menu') {\n                headerTitle.textContent = 'EDIT DATA';\n                headerBackBtn.classList.remove('hidden');\n                headerHomeIcon.classList.add('hidden');\n                content.innerHTML = renderEditMenuScreen();\n            } else if (state.screen === 'edit-village') {\n                const village = getVillageById(state.villageId);\n                headerTitle.textContent = `EDIT: ${village ? village.caption : ''}`;\n                headerBackBtn.classList.remove('hidden');\n                headerHomeIcon.classList.add('hidden');\n                headerRight.innerHTML = `\n                    <button onclick=\"openEditMenu()\"\n                        class=\"px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors\">\n                        ਸਾਰੇ ਪਿੰਡ\n                    <\/button>\n                `;\n                content.innerHTML = renderEditVillageScreen(village);\n            }\n        }\n\n        /**\n         * ============================================================================\n         * 5. HOME SCREEN (MAIN) & GLOBAL SEARCH\n         * ============================================================================\n         */\n        function renderHomeScreen() {\n            // Build exact village button grid\n            let gridHtml = '<div class=\"space-y-2.5\">';\n            BUTTON_GRID_ROWS.forEach(rowIds => {\n                if (rowIds.length === 2) {\n                    gridHtml += `<div class=\"grid grid-cols-2 gap-2\">`;\n                    rowIds.forEach(id => {\n                        const v = getVillageById(id);\n                        if (v) {\n                            gridHtml += `\n                                <button onclick=\"openVillage('${v.id}')\"\n                                    class=\"w-full min-h-[52px] px-2 py-2 bg-[#155787] hover:bg-[#0f4166] active:scale-[0.99] text-white font-medium text-[18px] sm:text-[19px] leading-snug rounded-[4px] shadow-md transition-all flex items-center justify-center text-center\">\n                                    ${escapeHtml(v.caption)}\n                                <\/button>\n                            `;\n                        }\n                    });\n                    gridHtml += `<\/div>`;\n                } else {\n                    const v = getVillageById(rowIds[0]);\n                    if (v) {\n                        gridHtml += `\n                            <button onclick=\"openVillage('${v.id}')\"\n                                class=\"w-full min-h-[52px] px-3 py-2 bg-[#155787] hover:bg-[#0f4166] active:scale-[0.99] text-white font-medium text-[18px] sm:text-[19px] leading-snug rounded-[4px] shadow-md transition-all flex items-center justify-center text-center\">\n                                ${escapeHtml(v.caption)}\n                            <\/button>\n                        `;\n                    }\n                }\n            });\n\n            // Row 8: Full-width Red EDIT DATA button\n            gridHtml += `\n                <div class=\"pt-1\">\n                    <button onclick=\"openEditMenu()\"\n                        class=\"w-full h-[58px] px-4 bg-[#99091f] hover:bg-[#7a0718] active:scale-[0.99] text-white font-semibold text-[19px] tracking-wide rounded-[4px] shadow-md transition-all flex items-center justify-center\">\n                        EDIT DATA\n                    <\/button>\n                <\/div>\n            `;\n            gridHtml += '<\/div>';\n\n            return `\n                <\!-- Compact Global Search Bar -->\n                <div class=\"mb-3.5 relative\">\n                    <div class=\"relative flex items-center\">\n                        <svg class=\"w-5 h-5 text-gray-400 absolute left-3 pointer-events-none\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\n                            <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z\" />\n                        <\/svg>\n                        <input\n                            id=\"global-search-input\"\n                            type=\"text\"\n                            value=\"${escapeHtml(state.searchQuery)}\"\n                            placeholder=\"ਕਿਸੇ ਵੀ ਮੈਂਬਰ ਦਾ ਨਾਮ ਖੋਜੋ...\"\n                            class=\"w-full pl-10 pr-9 py-2.5 bg-white border border-gray-300 rounded-lg text-sm sm:text-base text-[#0e5e55] placeholder-gray-400 shadow-sm focus:outline-none focus:ring-2 focus:ring-[#155787] focus:border-[#155787]\"\n                            autocomplete=\"off\"\n                        />\n                        <button id=\"clear-search-btn\" onclick=\"clearGlobalSearch()\"\n                            class=\"${state.searchQuery ? '' : 'hidden'} absolute right-2.5 p-1 text-gray-400 hover:text-gray-700 rounded-full\"\n                            aria-label=\"Clear search\">\n                            <svg class=\"w-4 h-4\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\n                                <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.2\" d=\"M6 18L18 6M6 6l12 12\" />\n                            <\/svg>\n                        <\/button>\n                    <\/div>\n                    <\!-- Live Search Results Dropdown -->\n                    <div id=\"global-search-results\" class=\"mt-2\">\n                        ${renderSearchResults(state.searchQuery)}\n                    <\/div>\n                <\/div>\n\n                <\!-- Exact Village Button Grid -->\n                ${gridHtml}\n            `;\n        }\n\n        function attachHomeSearchListener() {\n            const input = document.getElementById('global-search-input');\n            if (!input) return;\n            input.addEventListener('input', (e) => {\n                state.searchQuery = e.target.value;\n                const clearBtn = document.getElementById('clear-search-btn');\n                if (clearBtn) {\n                    clearBtn.classList.toggle('hidden', !state.searchQuery);\n                }\n                const resultsBox = document.getElementById('global-search-results');\n                if (resultsBox) {\n                    resultsBox.innerHTML = renderSearchResults(state.searchQuery);\n                }\n            });\n        }\n\n        function clearGlobalSearch() {\n            state.searchQuery = '';\n            const input = document.getElementById('global-search-input');\n            if (input) {\n                input.value = '';\n                input.focus();\n            }\n            const clearBtn = document.getElementById('clear-search-btn');\n            if (clearBtn) clearBtn.classList.add('hidden');\n            const resultsBox = document.getElementById('global-search-results');\n            if (resultsBox) resultsBox.innerHTML = '';\n        }\n\n        /**\n         * Perform global search across all villages, family names, and member rows\n         */\n        function renderSearchResults(rawQuery) {\n            const q = (rawQuery || '').trim().toLowerCase();\n            if (!q) return '';\n\n            const matches = [];\n            appData.forEach(village => {\n                village.families.forEach((family, fIdx) => {\n                    let matchedInFamily = false;\n                    // Check rows first for specific row match\n                    family.rows.forEach((row, rIdx) => {\n                        const hitCells = row.filter(cell => cell && String(cell).toLowerCase().includes(q));\n                        if (hitCells.length > 0) {\n                            matchedInFamily = true;\n                            matches.push({\n                                villageId: village.id,\n                                villageCaption: village.caption,\n                                familyIndex: fIdx,\n                                familyName: family.name,\n                                rowIndex: rIdx,\n                                rowHead: row[0] || family.name,\n                                snippet: hitCells.join(' • ')\n                            });\n                        }\n                    });\n                    // Also check family name if no row matched\n                    if (!matchedInFamily && family.name && family.name.toLowerCase().includes(q)) {\n                        matches.push({\n                            villageId: village.id,\n                            villageCaption: village.caption,\n                            familyIndex: fIdx,\n                            familyName: family.name,\n                            rowIndex: 0,\n                            rowHead: family.name,\n                            snippet: family.name\n                        });\n                    }\n                });\n            });\n\n            if (matches.length === 0) {\n                return `\n                    <div class=\"bg-white border border-gray-200 rounded-lg p-3 text-center text-sm text-gray-500 shadow-sm\">\n                        \"<strong>${escapeHtml(rawQuery)}<\/strong>\" ਲਈ ਕੋਈ ਮੈਂਬਰ ਨਹੀਂ ਮਿਲਿਆ।\n                    <\/div>\n                `;\n            }\n\n            const maxToShow = 25;\n            const visibleMatches = matches.slice(0, maxToShow);\n\n            return `\n                <div class=\"bg-white border border-gray-200 rounded-lg shadow-md overflow-hidden\">\n                    <div class=\"bg-[#155787]/10 px-3 py-1.5 text-xs font-semibold text-[#155787] flex justify-between items-center\">\n                        <span>ਖੋਜ ਨਤੀਜੇ (${matches.length})<\/span>\n                        <span>ਖੋਲ੍ਹਣ ਲਈ ਕਲਿੱਕ ਕਰੋ<\/span>\n                    <\/div>\n                    <div class=\"max-h-64 overflow-y-auto divide-y divide-gray-100\">\n                        ${visibleMatches.map(m => `\n                            <button onclick=\"openVillage('${escapeHtml(m.villageId)}', ${m.familyIndex}, ${m.rowIndex})\"\n                                class=\"w-full text-left px-3 py-2.5 hover:bg-[#155787] hover:text-white group transition-colors\">\n                                <div class=\"flex items-center justify-between gap-2\">\n                                    <span class=\"font-semibold text-sm text-[#0e5e55] group-hover:text-white truncate\">${escapeHtml(m.rowHead)}<\/span>\n                                    <span class=\"text-[11px] px-2 py-0.5 rounded-full bg-blue-50 text-[#155787] group-hover:bg-white/20 group-hover:text-white shrink-0\">\n                                        ${escapeHtml(m.villageCaption)}\n                                    <\/span>\n                                <\/div>\n                                <p class=\"text-xs text-gray-500 group-hover:text-blue-100 mt-0.5 truncate\">\n                                    ਪਰਿਵਾਰ: ${escapeHtml(m.familyName)} — ${escapeHtml(m.snippet)}\n                                <\/p>\n                            <\/button>\n                        `).join('')}\n                    <\/div>\n                    ${matches.length > maxToShow ? `<div class=\"px-3 py-1.5 text-center text-xs text-gray-500 bg-gray-50\">ਹੋਰ ${matches.length - maxToShow} ਨਤੀਜੇ ਮੌਜੂਦ ਹਨ — ਖੋਜ ਨੂੰ ਹੋਰ ਸਪੱਸ਼ਟ ਕਰੋ<\/div>` : ''}\n                <\/div>\n            `;\n        }\n\n        /**\n         * ============================================================================\n         * 6. VILLAGE VIEW SCREEN\n         * ============================================================================\n         */\n        function renderVillageScreen(village) {\n            if (!village) return '<p class=\"text-center py-8 text-gray-500\">ਪਿੰਡ ਨਹੀਂ ਮਿਲਿਆ।<\/p>';\n\n            const families = village.families || [];\n            if (families.length === 0) {\n                return `\n                    <div class=\"flex items-center gap-2 mb-4\">\n                        <button onclick=\"navigateHome()\" class=\"px-4 py-2.5 bg-[#bf0a0a] text-white text-xs font-bold rounded-[8px] shadow\">HOME<\/button>\n                    <\/div>\n                    <div class=\"bg-white rounded-xl p-6 text-center shadow-sm border border-gray-200\">\n                        <p class=\"text-gray-600 mb-3\">ਇਸ ਪਿੰਡ ਵਿੱਚ ਅਜੇ ਕੋਈ ਪਰਿਵਾਰ ਦਰਜ ਨਹੀਂ ਹੈ।<\/p>\n                        <button onclick=\"openEditVillage('${escapeHtml(village.id)}')\" class=\"px-4 py-2 bg-[#155787] text-white rounded-lg text-sm font-medium\">\n                            + ਪਰਿਵਾਰ ਜੋੜੋ\n                        <\/button>\n                    <\/div>\n                `;\n            }\n\n            const activeFamily = families[state.familyIndex] || families[0];\n            const rows = activeFamily.rows || [];\n\n            // Determine max non-empty columns in the selected family (at least 1)\n            let maxCols = 1;\n            rows.forEach(r => {\n                if (Array.isArray(r)) {\n                    for (let i = r.length - 1; i >= 0; i--) {\n                        if (r[i] && String(r[i]).trim() !== '') {\n                            if (i + 1 > maxCols) maxCols = i + 1;\n                            break;\n                        }\n                    }\n                }\n            });\n            maxCols = Math.min(maxCols, 8);\n\n            // Top Control Bar: Red HOME button + Family Selector Dropdown + Prev/Next arrows\n            const controlBarHtml = `\n                <div class=\"flex items-stretch gap-2 mb-3\">\n                    <button onclick=\"navigateHome()\"\n                        class=\"w-[68px] shrink-0 bg-[#bf0a0a] hover:bg-[#990808] active:scale-[0.98] text-white text-xs font-bold tracking-wider rounded-[8px] shadow-md transition-all flex items-center justify-center\">\n                        HOME\n                    <\/button>\n\n                    <div class=\"flex-1 bg-white rounded-[8px] shadow-md border border-gray-200 px-2.5 py-1.5 flex items-center gap-1.5 min-w-0\">\n                        <button onclick=\"stepFamily(-1)\" ${families.length <= 1 ? 'disabled' : ''}\n                            class=\"p-1.5 rounded-md text-[#155787] hover:bg-blue-50 disabled:opacity-30 shrink-0\"\n                            aria-label=\"Previous family\" title=\"ਪਿਛਲਾ ਪਰਿਵਾਰ\">\n                            <svg class=\"w-4 h-4\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\n                                <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.5\" d=\"M15 19l-7-7 7-7\" />\n                            <\/svg>\n                        <\/button>\n\n                        <div class=\"flex-1 min-w-0\">\n                            <label for=\"family-select\" class=\"block text-[11px] font-medium text-[#0e5e55] leading-none mb-0.5\">\n                                ਪਰਿਵਾਰ ਚੁਣੋ (${state.familyIndex + 1}/${families.length})\n                            <\/label>\n                            <select id=\"family-select\" onchange=\"selectFamily(parseInt(this.value, 10))\"\n                                class=\"w-full bg-transparent text-[#155787] font-bold text-base focus:outline-none truncate cursor-pointer\">\n                                ${families.map((fam, idx) => `\n                                    <option value=\"${idx}\" ${idx === state.familyIndex ? 'selected' : ''}>\n                                        ${escapeHtml(fam.name)}\n                                    <\/option>\n                                `).join('')}\n                            <\/select>\n                        <\/div>\n\n                        <button onclick=\"stepFamily(1)\" ${families.length <= 1 ? 'disabled' : ''}\n                            class=\"p-1.5 rounded-md text-[#155787] hover:bg-blue-50 disabled:opacity-30 shrink-0\"\n                            aria-label=\"Next family\" title=\"ਅਗਲਾ ਪਰਿਵਾਰ\">\n                            <svg class=\"w-4 h-4\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\n                                <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.5\" d=\"M9 5l7 7-7 7\" />\n                            <\/svg>\n                        <\/button>\n                    <\/div>\n                <\/div>\n            `;\n\n            // Horizontal Family Tabs for quick tapping\n            const tabsHtml = `\n                <div class=\"flex gap-1.5 overflow-x-auto pb-2 mb-2.5 no-scrollbar\">\n                    ${families.map((fam, idx) => `\n                        <button onclick=\"selectFamily(${idx})\"\n                            class=\"shrink-0 px-3 py-1.5 rounded-full text-xs sm:text-sm font-medium transition-all border ${\n                                idx === state.familyIndex\n                                    ? 'bg-[#155787] text-white border-[#155787] shadow-sm'\n                                    : 'bg-white text-[#0e5e55] border-gray-300 hover:border-[#155787]'\n                            }\">\n                            ${escapeHtml(fam.name)}\n                        <\/button>\n                    `).join('')}\n                <\/div>\n            `;\n\n            // View Mode Switcher (Table vs Card) + Row count info\n            const toolbarHtml = `\n                <div class=\"flex items-center justify-between gap-2 mb-2.5\">\n                    <span class=\"text-xs font-medium text-gray-600\">\n                        ਕੁੱਲ ਸ਼ਾਖਾਵਾਂ: <strong class=\"text-[#155787]\">${rows.length}<\/strong> • ਵੇਰਵੇ ਲਈ ਕਲਿੱਕ ਕਰੋ\n                    <\/span>\n                    <div class=\"inline-flex rounded-lg bg-white border border-gray-300 p-0.5 shadow-sm\">\n                        <button onclick=\"setViewMode('table')\"\n                            class=\"px-2.5 py-1 rounded-md text-xs font-semibold transition-colors ${\n                                state.viewMode === 'table' ? 'bg-[#155787] text-white' : 'text-gray-600 hover:text-[#155787]'\n                            }\">\n                            ਟੇਬਲ\n                        <\/button>\n                        <button onclick=\"setViewMode('card')\"\n                            class=\"px-2.5 py-1 rounded-md text-xs font-semibold transition-colors ${\n                                state.viewMode === 'card' ? 'bg-[#155787] text-white' : 'text-gray-600 hover:text-[#155787]'\n                            }\">\n                            ਕਾਰਡ\n                        <\/button>\n                    <\/div>\n                <\/div>\n            `;\n\n            // Data Display (Table or Card View)\n            let dataViewHtml = '';\n            if (state.viewMode === 'table') {\n                dataViewHtml = `\n                    <div class=\"bg-white rounded-[8px] shadow-md border border-gray-200 overflow-hidden\">\n                        <div class=\"overflow-x-auto\">\n                            <table class=\"w-full text-left border-collapse\">\n                                <thead>\n                                    <tr class=\"bg-[#155787] text-white text-xs sm:text-sm\">\n                                        ${Array.from({ length: maxCols }, (_, cIdx) => `\n                                            <th class=\"py-2.5 px-3 font-semibold whitespace-nowrap border-r border-white/15 last:border-r-0\">\n                                                ${COLUMN_LABELS[cIdx]}\n                                            <\/th>\n                                        `).join('')}\n                                    <\/tr>\n                                <\/thead>\n                                <tbody class=\"divide-y divide-gray-200 text-sm\">\n                                    ${rows.map((row, rIdx) => {\n                                        const isSelected = state.selectedRowIndex === rIdx;\n                                        return `\n                                            <tr onclick=\"openRowDetail(${rIdx})\"\n                                                class=\"cursor-pointer transition-colors ${\n                                                    isSelected\n                                                        ? 'bg-[#155787] text-white'\n                                                        : 'bg-[#f5f5f5] text-[#0e5e55] hover:bg-[#155787] hover:text-white'\n                                                }\">\n                                                ${Array.from({ length: maxCols }, (_, cIdx) => {\n                                                    const val = (row && row[cIdx]) ? row[cIdx] : '';\n                                                    return `\n                                                        <td class=\"py-2.5 px-3 align-top border-r border-gray-200/60 last:border-r-0 ${cIdx === 0 ? 'font-semibold min-w-[130px]' : 'min-w-[115px]'}\">\n                                                            ${escapeHtml(val) || '<span class=\"opacity-30\">—<\/span>'}\n                                                        <\/td>\n                                                    `;\n                                                }).join('')}\n                                            <\/tr>\n                                        `;\n                                    }).join('')}\n                                <\/tbody>\n                            <\/table>\n                        <\/div>\n                    <\/div>\n                `;\n            } else {\n                // Card View\n                dataViewHtml = `\n                    <div class=\"space-y-2.5\">\n                        ${rows.map((row, rIdx) => {\n                            const nonEmpty = (row || []).map((val, idx) => ({ label: COLUMN_LABELS[idx], val: (val || '').trim() })).filter(item => item.val !== '');\n                            const isSelected = state.selectedRowIndex === rIdx;\n                            return `\n                                <div onclick=\"openRowDetail(${rIdx})\"\n                                    class=\"rounded-[8px] shadow-sm border p-3 cursor-pointer transition-all ${\n                                        isSelected\n                                            ? 'bg-[#155787] text-white border-[#155787]'\n                                            : 'bg-white text-[#0e5e55] border-gray-200 hover:border-[#155787] hover:shadow-md'\n                                    }\">\n                                    <div class=\"flex items-start justify-between gap-2 pb-2 mb-2 border-b ${isSelected ? 'border-white/20' : 'border-gray-100'}\">\n                                        <h3 class=\"font-bold text-base\">\n                                            ${escapeHtml(nonEmpty[0] ? nonEmpty[0].val : 'ਬਿਨਾਂ ਨਾਮ')}\n                                        <\/h3>\n                                        <span class=\"text-[11px] px-2 py-0.5 rounded-full shrink-0 ${isSelected ? 'bg-white/20 text-white' : 'bg-[#155787]/10 text-[#155787]'}\">\n                                            ${nonEmpty.length} ਮੈਂਬਰ\n                                        <\/span>\n                                    <\/div>\n                                    ${nonEmpty.length > 1 ? `\n                                        <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-1.5 text-sm\">\n                                            ${nonEmpty.slice(1).map(item => `\n                                                <div class=\"flex items-baseline gap-1.5\">\n                                                    <span class=\"text-[11px] font-medium shrink-0 ${isSelected ? 'text-blue-200' : 'text-gray-400'}\">${item.label}:<\/span>\n                                                    <span class=\"break-words\">${escapeHtml(item.val)}<\/span>\n                                                <\/div>\n                                            `).join('')}\n                                        <\/div>\n                                    ` : `<p class=\"text-xs opacity-70\">ਹੋਰ ਮੈਂਬਰ ਦਰਜ ਨਹੀਂ ਹਨ<\/p>`}\n                                <\/div>\n                            `;\n                        }).join('')}\n                    <\/div>\n                `;\n            }\n\n            return controlBarHtml + tabsHtml + toolbarHtml + dataViewHtml;\n        }\n\n        function selectFamily(idx) {\n            state.familyIndex = idx;\n            state.selectedRowIndex = null;\n            render();\n        }\n\n        function stepFamily(delta) {\n            const village = getVillageById(state.villageId);\n            if (!village || village.families.length <= 1) return;\n            const len = village.families.length;\n            state.familyIndex = (state.familyIndex + delta + len) % len;\n            state.selectedRowIndex = null;\n            render();\n        }\n\n        function setViewMode(mode) {\n            state.viewMode = mode;\n            render();\n        }\n\n        /**\n         * ============================================================================\n         * 7. ROW DETAIL MODAL\n         * ============================================================================\n         */\n        function openRowDetail(rowIndex) {\n            const village = getVillageById(state.villageId);\n            if (!village) return;\n            const family = village.families[state.familyIndex];\n            if (!family || !family.rows[rowIndex]) return;\n\n            state.selectedRowIndex = rowIndex;\n            render();\n\n            const row = family.rows[rowIndex];\n            const modal = document.getElementById('detail-modal');\n            const title = document.getElementById('detail-modal-title');\n            const subtitle = document.getElementById('detail-modal-subtitle');\n            const body = document.getElementById('detail-modal-body');\n\n            subtitle.textContent = `${village.caption} • ${family.name}`;\n            title.textContent = row[0] || family.name;\n\n            const copyLines = [`${village.caption} (${family.name})`];\n            let itemsHtml = '';\n\n            row.forEach((cell, idx) => {\n                const text = (cell || '').trim();\n                if (text !== '') {\n                    const label = COLUMN_LABELS[idx] || `ਮੈਂਬਰ ${idx}`;\n                    copyLines.push(`${label}: ${text}`);\n                    itemsHtml += `\n                        <div class=\"bg-white rounded-lg p-3 border border-gray-200 shadow-sm\">\n                            <div class=\"text-[11px] font-semibold uppercase tracking-wide text-[#155787] mb-0.5\">${label}<\/div>\n                            <div class=\"text-base font-medium text-[#0e5e55] break-words\">${escapeHtml(text)}<\/div>\n                        <\/div>\n                    `;\n                }\n            });\n\n            if (!itemsHtml) {\n                itemsHtml = '<p class=\"text-center text-sm text-gray-500 py-4\">ਕੋਈ ਵੇਰਵਾ ਉਪਲਬਧ ਨਹੀਂ ਹੈ।<\/p>';\n            }\n\n            activeDetailCopyText = copyLines.join('\\n');\n            body.innerHTML = itemsHtml;\n\n            modal.classList.remove('hidden');\n            modal.classList.add('flex');\n        }\n\n        function closeDetailModal() {\n            const modal = document.getElementById('detail-modal');\n            modal.classList.add('hidden');\n            modal.classList.remove('flex');\n        }\n\n        function copyDetailModalText() {\n            if (!activeDetailCopyText) return;\n            try {\n                const textarea = document.createElement('textarea');\n                textarea.value = activeDetailCopyText;\n                textarea.style.position = 'fixed';\n                textarea.style.opacity = '0';\n                document.body.appendChild(textarea);\n                textarea.select();\n                document.execCommand('copy');\n                document.body.removeChild(textarea);\n                showToast('ਵੇਰਵਾ ਕਲਿੱਪਬੋਰਡ ਵਿੱਚ ਕਾਪੀ ਹੋ ਗਿਆ!');\n            } catch (err) {\n                showToast('ਕਾਪੀ ਕਰਨ ਵਿੱਚ ਮੁਸ਼ਕਲ ਆਈ।', 'error');\n            }\n        }\n\n        /**\n         * ============================================================================\n         * 8. EDIT DATA MENU SCREEN (RED BUTTONS + BACKUP UTILITIES)\n         * ============================================================================\n         */\n        function renderEditMenuScreen() {\n            let gridHtml = '<div class=\"space-y-2.5\">';\n            BUTTON_GRID_ROWS.forEach(rowIds => {\n                if (rowIds.length === 2) {\n                    gridHtml += `<div class=\"grid grid-cols-2 gap-2\">`;\n                    rowIds.forEach(id => {\n                        const v = getVillageById(id);\n                        if (v) {\n                            gridHtml += `\n                                <button onclick=\"openEditVillage('${v.id}')\"\n                                    class=\"w-full min-h-[54px] px-2 py-2 bg-[#99091f] hover:bg-[#7a0718] active:scale-[0.99] text-white font-medium text-[18px] leading-snug rounded-[4px] shadow-md transition-all flex items-center justify-center text-center\">\n                                    ${escapeHtml(v.caption)}\n                                <\/button>\n                            `;\n                        }\n                    });\n                    gridHtml += `<\/div>`;\n                } else {\n                    const v = getVillageById(rowIds[0]);\n                    if (v) {\n                        gridHtml += `\n                            <button onclick=\"openEditVillage('${v.id}')\"\n                                class=\"w-full min-h-[54px] px-3 py-2 bg-[#99091f] hover:bg-[#7a0718] active:scale-[0.99] text-white font-medium text-[18px] leading-snug rounded-[4px] shadow-md transition-all flex items-center justify-center text-center\">\n                                ${escapeHtml(v.caption)}\n                            <\/button>\n                        `;\n                    }\n                }\n            });\n            gridHtml += '<\/div>';\n\n            return `\n                <\!-- Top Control Bar -->\n                <div class=\"flex items-center justify-between gap-2 mb-3.5\">\n                    <button onclick=\"navigateHome()\"\n                        class=\"px-4 py-2.5 bg-[#bf0a0a] hover:bg-[#990808] text-white text-xs font-bold tracking-wider rounded-[8px] shadow-md transition-colors\">\n                        HOME\n                    <\/button>\n                    <p class=\"text-xs sm:text-sm font-medium text-gray-600 text-right\">\n                        ਐਡਿਟ ਕਰਨ ਲਈ ਪਿੰਡ ਚੁਣੋ\n                    <\/p>\n                <\/div>\n\n                <\!-- Red Village Buttons -->\n                ${gridHtml}\n\n                <\!-- Backup & Utility Tools -->\n                <div class=\"mt-5 bg-white rounded-xl border border-gray-200 shadow-sm p-3.5\">\n                    <h3 class=\"text-xs font-bold uppercase tracking-wider text-gray-500 mb-2.5\">\n                        ਬੈਕਅੱਪ ਅਤੇ ਡਾਟਾ ਪ੍ਰਬੰਧਨ (Backup &amp; Reset)\n                    <\/h3>\n                    <div class=\"grid grid-cols-1 sm:grid-cols-3 gap-2\">\n                        <button onclick=\"exportDataJson()\"\n                            class=\"px-3 py-2.5 rounded-lg bg-[#155787] hover:bg-[#0f4166] text-white text-xs font-semibold shadow-sm transition-colors flex items-center justify-center gap-1.5\">\n                            <svg class=\"w-4 h-4\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\n                                <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4\" />\n                            <\/svg>\n                            Export JSON (Backup)\n                        <\/button>\n                        <button onclick=\"triggerImportJson()\"\n                            class=\"px-3 py-2.5 rounded-lg bg-[#0e5e55] hover:bg-[#0a4740] text-white text-xs font-semibold shadow-sm transition-colors flex items-center justify-center gap-1.5\">\n                            <svg class=\"w-4 h-4\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\n                                <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12\" />\n                            <\/svg>\n                            Import JSON\n                        <\/button>\n                        <button onclick=\"confirmResetDefault()\"\n                            class=\"px-3 py-2.5 rounded-lg bg-gray-100 hover:bg-[#99091f] text-[#99091f] hover:text-white border border-gray-300 hover:border-[#99091f] text-xs font-semibold transition-colors flex items-center justify-center gap-1.5\">\n                            <svg class=\"w-4 h-4\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\n                                <path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15\" />\n                            <\/svg>\n                            Reset Default\n                        <\/button>\n                    <\/div>\n                <\/div>\n            `;\n        }\n\n        /**\n         * ============================================================================\n         * 9. VILLAGE EDITOR SCREEN (ADD / EDIT / DELETE FAMILIES & ROWS)\n         * ============================================================================\n         */\n        function renderEditVillageScreen(village) {\n            if (!village) return '<p class=\"text-center py-8 text-gray-500\">ਪਿੰਡ ਨਹੀਂ ਮਿਲਿਆ।<\/p>';\n\n            const families = village.families || [];\n            if (state.editFamilyIndex >= families.length) {\n                state.editFamilyIndex = Math.max(0, families.length - 1);\n            }\n            const activeFamily = families[state.editFamilyIndex] || null;\n\n            return `\n                <\!-- Top Navigation & Add Family Bar -->\n                <div class=\"flex flex-wrap items-center justify-between gap-2 mb-3\">\n                    <div class=\"flex items-center gap-2\">\n                        <button onclick=\"navigateHome()\"\n                            class=\"px-3.5 py-2 bg-[#bf0a0a] hover:bg-[#990808] text-white text-xs font-bold rounded-[8px] shadow\">\n                            HOME\n                        <\/button>\n                        <button onclick=\"openVillage('${escapeHtml(village.id)}', ${state.editFamilyIndex})\"\n                            class=\"px-3.5 py-2 bg-[#155787] hover:bg-[#0f4166] text-white text-xs font-semibold rounded-[8px] shadow\">\n                            ਵਿਊ ਦੇਖੋ\n                        <\/button>\n                    <\/div>\n                    <button onclick=\"addNewFamily()\"\n                        class=\"px-3.5 py-2 bg-[#0e5e55] hover:bg-[#0a4740] text-white text-xs sm:text-sm font-semibold rounded-[8px] shadow flex items-center gap-1\">\n                        + ਨਵਾਂ ਪਰਿਵਾਰ ਜੋੜੋ\n                    <\/button>\n                <\/div>\n\n                ${families.length === 0 ? `\n                    <div class=\"bg-white rounded-xl p-6 text-center border border-gray-200 shadow-sm\">\n                        <p class=\"text-gray-600 text-sm mb-3\">ਇਸ ਪਿੰਡ ਵਿੱਚ ਕੋਈ ਪਰਿਵਾਰ ਨਹੀਂ ਹੈ।<\/p>\n                        <button onclick=\"addNewFamily()\" class=\"px-4 py-2 bg-[#0e5e55] text-white rounded-lg text-sm font-semibold\">\n                            + ਨਵਾਂ ਪਰਿਵਾਰ ਜੋੜੋ\n                        <\/button>\n                    <\/div>\n                ` : `\n                    <\!-- Family Selector Dropdown -->\n                    <div class=\"bg-white rounded-xl border border-gray-200 shadow-sm p-3 mb-3\">\n                        <label for=\"edit-family-select\" class=\"block text-xs font-semibold text-gray-500 mb-1\">\n                            ਐਡਿਟ ਕਰਨ ਲਈ ਪਰਿਵਾਰ ਚੁਣੋ (${families.length} ਪਰਿਵਾਰ):\n                        <\/label>\n                        <div class=\"flex items-center gap-2\">\n                            <select id=\"edit-family-select\" onchange=\"selectEditFamily(parseInt(this.value, 10))\"\n                                class=\"flex-1 px-3 py-2 bg-[#f5f5f5] border border-gray-300 rounded-lg text-sm sm:text-base font-semibold text-[#155787] focus:outline-none focus:ring-2 focus:ring-[#155787]\">\n                                ${families.map((f, idx) => `\n                                    <option value=\"${idx}\" ${idx === state.editFamilyIndex ? 'selected' : ''}>\n                                        ${idx + 1}. ${escapeHtml(f.name)}\n                                    <\/option>\n                                `).join('')}\n                            <\/select>\n                            <button onclick=\"confirmDeleteFamily()\"\n                                class=\"px-3 py-2 rounded-lg bg-red-50 text-[#99091f] hover:bg-[#99091f] hover:text-white border border-red-200 text-xs font-semibold transition-colors shrink-0\"\n                                title=\"ਇਸ ਪਰਿਵਾਰ ਨੂੰ ਮਿਟਾਓ\">\n                                ਮਿਟਾਓ\n                            <\/button>\n                        <\/div>\n                    <\/div>\n\n                    <\!-- Family Head Name Editor -->\n                    <div class=\"bg-white rounded-xl border border-gray-200 shadow-sm p-3 mb-3\">\n                        <label for=\"edit-family-name-input\" class=\"block text-xs font-semibold text-[#155787] mb-1\">\n                            ਪਰਿਵਾਰ ਦੇ ਮੁਖੀ ਦਾ ਨਾਮ (Family Head Name):\n                        <\/label>\n                        <input id=\"edit-family-name-input\" type=\"text\"\n                            value=\"${escapeHtml(activeFamily.name)}\"\n                            oninput=\"updateFamilyName(this.value)\"\n                            placeholder=\"ਪਰਿਵਾਰ ਦਾ ਨਾਮ ਲਿਖੋ...\"\n                            class=\"w-full px-3 py-2 bg-[#f5f5f5] border border-gray-300 rounded-lg text-sm sm:text-base font-medium text-[#0e5e55] focus:outline-none focus:ring-2 focus:ring-[#155787]\" />\n                    <\/div>\n\n                    <\!-- Editable Rows List -->\n                    <div class=\"space-y-3 mb-4\">\n                        ${(activeFamily.rows || []).map((row, rIdx) => `\n                            <div class=\"bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden\">\n                                <div class=\"bg-[#155787]/10 px-3 py-2 flex items-center justify-between border-b border-gray-200\">\n                                    <span class=\"text-xs font-bold text-[#155787]\">ਲਾਈਨ #${rIdx + 1}<\/span>\n                                    <button onclick=\"confirmDeleteRow(${rIdx})\"\n                                        class=\"text-xs font-semibold text-[#99091f] hover:underline px-2 py-0.5 rounded\">\n                                        ਲਾਈਨ ਮਿਟਾਓ\n                                    <\/button>\n                                <\/div>\n                                <div class=\"p-3 grid grid-cols-1 sm:grid-cols-2 gap-2.5\">\n                                    ${COLUMN_LABELS.map((label, cIdx) => `\n                                        <div>\n                                            <label class=\"block text-[11px] font-medium text-gray-500 mb-0.5\">${label}<\/label>\n                                            <input type=\"text\"\n                                                value=\"${escapeHtml((row && row[cIdx]) ? row[cIdx] : '')}\"\n                                                oninput=\"updateRowCell(${rIdx}, ${cIdx}, this.value)\"\n                                                placeholder=\"${label}...\"\n                                                class=\"w-full px-2.5 py-1.5 text-sm bg-[#f5f5f5] border border-gray-300 rounded-md text-[#0e5e55] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#155787]\" />\n                                        <\/div>\n                                    `).join('')}\n                                <\/div>\n                            <\/div>\n                        `).join('')}\n                    <\/div>\n\n                    <\!-- Action Buttons: Add Row + Save Changes -->\n                    <div class=\"sticky bottom-3 z-20 bg-white/95 backdrop-blur-sm p-2.5 rounded-xl border border-gray-200 shadow-lg flex items-center justify-between gap-2\">\n                        <button onclick=\"addNewRow()\"\n                            class=\"flex-1 py-2.5 px-3 bg-gray-100 hover:bg-gray-200 text-[#155787] font-semibold text-sm rounded-lg border border-gray-300 transition-colors\">\n                            + ਨਵੀਂ ਲਾਈਨ ਜੋੜੋ\n                        <\/button>\n                        <button onclick=\"saveEditorChanges()\"\n                            class=\"flex-1 py-2.5 px-4 bg-[#155787] hover:bg-[#0f4166] text-white font-bold text-sm rounded-lg shadow-md transition-colors\">\n                            ਸੇਵ ਕਰੋ (Save)\n                        <\/button>\n                    <\/div>\n                `}\n            `;\n        }\n\n        function selectEditFamily(idx) {\n            state.editFamilyIndex = idx;\n            render();\n        }\n\n        function updateFamilyName(newName) {\n            const village = getVillageById(state.villageId);\n            if (!village || !village.families[state.editFamilyIndex]) return;\n            village.families[state.editFamilyIndex].name = newName;\n            // Live update the dropdown option label without re-rendering input focus\n            const select = document.getElementById('edit-family-select');\n            if (select && select.options[state.editFamilyIndex]) {\n                select.options[state.editFamilyIndex].textContent = `${state.editFamilyIndex + 1}. ${newName || 'ਬਿਨਾਂ ਨਾਮ'}`;\n            }\n            saveData(false);\n        }\n\n        function updateRowCell(rowIdx, colIdx, value) {\n            const village = getVillageById(state.villageId);\n            if (!village || !village.families[state.editFamilyIndex]) return;\n            const rows = village.families[state.editFamilyIndex].rows;\n            if (!rows[rowIdx]) rows[rowIdx] = [];\n            rows[rowIdx][colIdx] = value;\n            saveData(false);\n        }\n\n        function addNewRow() {\n            const village = getVillageById(state.villageId);\n            if (!village || !village.families[state.editFamilyIndex]) return;\n            village.families[state.editFamilyIndex].rows.push(['']);\n            render();\n            showToast('ਨਵੀਂ ਲਾਈਨ ਜੋੜੀ ਗਈ — ਬਦਲਾਅ ਸੁਰੱਖਿਅਤ ਕਰਨ ਲਈ Save ਦਬਾਓ।');\n        }\n\n        function confirmDeleteRow(rowIdx) {\n            openConfirmModal(\n                'ਲਾਈਨ ਮਿਟਾਓ',\n                `ਕੀ ਤੁਸੀਂ ਵਾਕਈ ਲਾਈਨ #${rowIdx + 1} ਨੂੰ ਮਿਟਾਉਣਾ ਚਾਹੁੰਦੇ ਹੋ?`,\n                () => {\n                    const village = getVillageById(state.villageId);\n                    if (!village || !village.families[state.editFamilyIndex]) return;\n                    village.families[state.editFamilyIndex].rows.splice(rowIdx, 1);\n                    saveData(true, 'ਲਾਈਨ ਮਿਟਾ ਦਿੱਤੀ ਗਈ ਅਤੇ ਡਾਟਾ ਸੇਵ ਹੋ ਗਿਆ।');\n                    render();\n                }\n            );\n        }\n\n        function addNewFamily() {\n            const village = getVillageById(state.villageId);\n            if (!village) return;\n            const newNum = village.families.length + 1;\n            village.families.push({\n                name: `ਨਵਾਂ ਪਰਿਵਾਰ ${newNum}`,\n                rows: [[`ਨਵਾਂ ਪਰਿਵਾਰ ${newNum}`]]\n            });\n            state.editFamilyIndex = village.families.length - 1;\n            saveData(true, 'ਨਵਾਂ ਪਰਿਵਾਰ ਜੋੜਿਆ ਗਿਆ!');\n            render();\n        }\n\n        function confirmDeleteFamily() {\n            const village = getVillageById(state.villageId);\n            if (!village || !village.families[state.editFamilyIndex]) return;\n            const famName = village.families[state.editFamilyIndex].name;\n            openConfirmModal(\n                'ਪਰਿਵਾਰ ਮਿਟਾਓ',\n                `ਕੀ ਤੁਸੀਂ ਵਾਕਈ \"${famName}\" ਪਰਿਵਾਰ ਨੂੰ ਪੂਰੀ ਤਰ੍ਹਾਂ ਮਿਟਾਉਣਾ ਚਾਹੁੰਦੇ ਹੋ?`,\n                () => {\n                    village.families.splice(state.editFamilyIndex, 1);\n                    state.editFamilyIndex = Math.max(0, state.editFamilyIndex - 1);\n                    saveData(true, 'ਪਰਿਵਾਰ ਮਿਟਾ ਦਿੱਤਾ ਗਿਆ।');\n                    render();\n                }\n            );\n        }\n\n        function saveEditorChanges() {\n            const village = getVillageById(state.villageId);\n            if (village && village.families[state.editFamilyIndex]) {\n                const fam = village.families[state.editFamilyIndex];\n                fam.name = (fam.name || '').trim() || 'ਬਿਨਾਂ ਨਾਮ ਪਰਿਵਾਰ';\n                // Clean trailing empty cells in each row\n                fam.rows = fam.rows.map(row => {\n                    const cleaned = (row || []).map(cell => (cell || '').trim());\n                    while (cleaned.length > 1 && cleaned[cleaned.length - 1] === '') {\n                        cleaned.pop();\n                    }\n                    return cleaned;\n                });\n            }\n            saveData(true, 'ਤਬਦੀਲੀਆਂ ਸਫਲਤਾਪੂਰਵਕ ਸੇਵ ਹੋ ਗਈਆਂ!');\n            render();\n        }\n\n        /**\n         * ============================================================================\n         * 10. EXPORT (EXCEL & JSON), IMPORT & RESET DEFAULT UTILITIES\n         * ============================================================================\n         */\n        function sanitizeSheetName(name, usedNames) {\n            let cleaned = String(name || 'Sheet')\n                .replace(/[\\\\\\/\\?\\*\\[\\]:]/g, ' ')\n                .replace(/\\s+/g, ' ')\n                .trim();\n            if (!cleaned) cleaned = 'Sheet';\n            cleaned = cleaned.slice(0, 31);\n\n            let candidate = cleaned;\n            let counter = 2;\n            while (usedNames.has(candidate)) {\n                const suffix = `_${counter}`;\n                candidate = cleaned.slice(0, 31 - suffix.length) + suffix;\n                counter++;\n            }\n            usedNames.add(candidate);\n            return candidate;\n        }\n\n        function exportDataExcel() {\n            try {\n                // Build combined \"All Families\" dataset from live appData (includes all edits)\n                const allHeaders = ['ਪਿੰਡ', 'ਪਰਿਵਾਰ', 'Head', 'M1', 'M2', 'M3', 'M4', 'M5', 'M6', 'M7'];\n                const allRows = [allHeaders];\n\n                appData.forEach(village => {\n                    const vName = village.caption || '';\n                    (village.families || []).forEach(family => {\n                        const fName = family.name || '';\n                        const rows = (family.rows && family.rows.length > 0) ? family.rows : [[fName]];\n                        rows.forEach(row => {\n                            const padded = Array.from({ length: 8 }, (_, idx) => (row && row[idx] ? String(row[idx]).trim() : ''));\n                            allRows.push([vName, fName, ...padded]);\n                        });\n                    });\n                });\n\n                // Primary path: True .xlsx generation via SheetJS\n                if (typeof XLSX !== 'undefined' && XLSX.utils && XLSX.writeFile) {\n                    const wb = XLSX.utils.book_new();\n                    const usedSheetNames = new Set();\n\n                    // Sheet 1: All Families\n                    const allSheetName = sanitizeSheetName('All Families', usedSheetNames);\n                    const wsAll = XLSX.utils.aoa_to_sheet(allRows);\n                    wsAll['!cols'] = [\n                        { wch: 24 }, { wch: 24 },\n                        { wch: 24 }, { wch: 24 }, { wch: 24 }, { wch: 24 },\n                        { wch: 22 }, { wch: 22 }, { wch: 22 }, { wch: 22 }\n                    ];\n                    XLSX.utils.book_append_sheet(wb, wsAll, allSheetName);\n\n                    // Additional sheets: One per village\n                    const villageHeaders = ['ਪਰਿਵਾਰ', 'Head', 'M1', 'M2', 'M3', 'M4', 'M5', 'M6', 'M7'];\n                    appData.forEach(village => {\n                        const vRows = [villageHeaders];\n                        (village.families || []).forEach(family => {\n                            const fName = family.name || '';\n                            const rows = (family.rows && family.rows.length > 0) ? family.rows : [[fName]];\n                            rows.forEach(row => {\n                                const padded = Array.from({ length: 8 }, (_, idx) => (row && row[idx] ? String(row[idx]).trim() : ''));\n                                vRows.push([fName, ...padded]);\n                            });\n                        });\n                        const wsVillage = XLSX.utils.aoa_to_sheet(vRows);\n                        wsVillage['!cols'] = [\n                            { wch: 24 },\n                            { wch: 24 }, { wch: 24 }, { wch: 24 }, { wch: 24 },\n                            { wch: 22 }, { wch: 22 }, { wch: 22 }, { wch: 22 }\n                        ];\n                        const sheetName = sanitizeSheetName(village.caption || village.id, usedSheetNames);\n                        XLSX.utils.book_append_sheet(wb, wsVillage, sheetName);\n                    });\n\n                    XLSX.writeFile(wb, 'Family_Tree_Raj_Kumar.xlsx');\n                    showToast('ਐਕਸਲ ਫਾਈਲ ਡਾਊਨਲੋਡ ਹੋ ਗਈ ਹੈ!', 'success');\n                    return;\n                }\n\n                // Seamless Offline Fallback: UTF-8 HTML-table .xls file\n                const tableRowsHtml = allRows.map((r, rIdx) => {\n                    const tag = rIdx === 0 ? 'th' : 'td';\n                    return `<tr>${r.map(cell => `<${tag}>${escapeHtml(cell)}<\/${tag}>`).join('')}<\/tr>`;\n                }).join('');\n\n                const htmlExcel = `\\uFEFF<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><\/head><body><table border=\"1\">${tableRowsHtml}<\/table><\/body><\/html>`;\n                const blob = new Blob([htmlExcel], { type: 'application/vnd.ms-excel;charset=utf-8;' });\n                const url = URL.createObjectURL(blob);\n                const a = document.createElement('a');\n                a.href = url;\n                a.download = 'Family_Tree_Raj_Kumar.xls';\n                document.body.appendChild(a);\n                a.click();\n                document.body.removeChild(a);\n                URL.revokeObjectURL(url);\n                showToast('ਐਕਸਲ ਫਾਈਲ ਡਾਊਨਲੋਡ ਹੋ ਗਈ ਹੈ!', 'success');\n            } catch (err) {\n                console.error('Excel export failed:', err);\n                showToast('ਐਕਸਲ ਫਾਈਲ ਡਾਊਨਲੋਡ ਕਰਨ ਵਿੱਚ ਗਲਤੀ ਆਈ!', 'error');\n            }\n        }\n\n        function exportDataJson() {\n            try {\n                const dataStr = JSON.stringify(appData, null, 2);\n                const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });\n                const url = URL.createObjectURL(blob);\n                const a = document.createElement('a');\n                const dateStamp = new Date().toISOString().slice(0, 10);\n                a.href = url;\n                a.download = `family-tree-raj-kumar-${dateStamp}.json`;\n                document.body.appendChild(a);\n                a.click();\n                document.body.removeChild(a);\n                URL.revokeObjectURL(url);\n                showToast('ਬੈਕਅੱਪ JSON ਫਾਈਲ ਡਾਊਨਲੋਡ ਹੋ ਗਈ!');\n            } catch (err) {\n                console.error(err);\n                showToast('Export ਕਰਨ ਵਿੱਚ ਗਲਤੀ ਆਈ।', 'error');\n            }\n        }\n\n        function triggerImportJson() {\n            const fileInput = document.getElementById('import-file-input');\n            fileInput.value = '';\n            fileInput.click();\n        }\n\n        function handleImportFile(event) {\n            const file = event.target.files && event.target.files[0];\n            if (!file) return;\n\n            const reader = new FileReader();\n            reader.onload = function(e) {\n                try {\n                    const parsed = JSON.parse(e.target.result);\n                    if (!Array.isArray(parsed) || !parsed.every(v => v && typeof v.id === 'string' && Array.isArray(v.families))) {\n                        showToast('ਗਲਤ JSON ਫਾਰਮੈਟ! ਕਿਰਪਾ ਕਰਕੇ ਸਹੀ ਬੈਕਅੱਪ ਫਾਈਲ ਚੁਣੋ।', 'error');\n                        return;\n                    }\n                    appData = parsed;\n                    saveData(true, 'ਡਾਟਾ ਸਫਲਤਾਪੂਰਵਕ Import ਹੋ ਗਿਆ!');\n                    render();\n                } catch (err) {\n                    console.error(err);\n                    showToast('JSON ਫਾਈਲ ਪੜ੍ਹਨ ਵਿੱਚ ਗਲਤੀ ਆਈ!', 'error');\n                }\n            };\n            reader.readAsText(file);\n        }\n\n        function confirmResetDefault() {\n            openConfirmModal(\n                'ਡਿਫੌਲਟ ਡਾਟਾ ਰੀਸੈੱਟ ਕਰੋ',\n                'ਕੀ ਤੁਸੀਂ ਸਾਰਾ ਡਾਟਾ ਮੂਲ (Default) ਸਥਿਤੀ ਵਿੱਚ ਵਾਪਸ ਲਿਆਉਣਾ ਚਾਹੁੰਦੇ ਹੋ? ਤੁਹਾਡੇ ਵੱਲੋਂ ਕੀਤੀਆਂ ਸਾਰੀਆਂ ਤਬਦੀਲੀਆਂ ਮਿਟ ਜਾਣਗੀਆਂ।',\n                () => {\n                    appData = deepClone(DEFAULT_DATA);\n                    saveData(true, 'ਮੂਲ ਡਾਟਾ ਸਫਲਤਾਪੂਰਵਕ ਬਹਾਲ ਹੋ ਗਿਆ!');\n                    render();\n                }\n            );\n        }\n\n        /**\n         * ============================================================================\n         * 11. CUSTOM CONFIRMATION MODAL HELPERS\n         * ============================================================================\n         */\n        function openConfirmModal(title, message, onConfirm) {\n            document.getElementById('confirm-modal-title').textContent = title;\n            document.getElementById('confirm-modal-message').textContent = message;\n            pendingConfirmCallback = onConfirm;\n\n            const modal = document.getElementById('confirm-modal');\n            modal.classList.remove('hidden');\n            modal.classList.add('flex');\n        }\n\n        function closeConfirmModal() {\n            const modal = document.getElementById('confirm-modal');\n            modal.classList.add('hidden');\n            modal.classList.remove('flex');\n            pendingConfirmCallback = null;\n        }\n\n        document.getElementById('confirm-modal-ok-btn').addEventListener('click', () => {\n            const cb = pendingConfirmCallback;\n            closeConfirmModal();\n            if (typeof cb === 'function') cb();\n        });\n\n        // Close modals on backdrop click or Escape key\n        document.getElementById('detail-modal').addEventListener('click', (e) => {\n            if (e.target.id === 'detail-modal') closeDetailModal();\n        });\n        document.getElementById('confirm-modal').addEventListener('click', (e) => {\n            if (e.target.id === 'confirm-modal') closeConfirmModal();\n        });\n        document.addEventListener('keydown', (e) => {\n            if (e.key === 'Escape') {\n                closeDetailModal();\n                closeConfirmModal();\n            }\n        });\n\n        /**\n         * ============================================================================\n         * 12. INITIALIZE APPLICATION\n         * ============================================================================\n     let customFiles = [];
    let hiddenBuiltinIds = [];
    let filesData = [];
    let isEditMode = false;

    const mobileShell = document.getElementById("mobileShell");
    const homeScreen = document.getElementById("homeScreen");
    const viewerScreen = document.getElementById("viewerScreen");
    const appsContainer = document.getElementById("appsContainer");
    const fileInput = document.getElementById("fileInput");
    const folderInput = document.getElementById("folderInput");
    const editBtn = document.getElementById("editBtn");
    const saveBtn = document.getElementById("saveBtn");
    const resetBtn = document.getElementById("resetBtn");
    const expandBtn = document.getElementById("expandBtn");
    const closeBtn = document.getElementById("closeBtn");
    const viewerTitle = document.getElementById("viewerTitle");
    const fileFrame = document.getElementById("fileFrame");
    const statusBar = document.getElementById("statusBar");

    function setStatus(msg) {
      statusBar.textContent = msg;
    }

    function rebuildFilesList() {
      const activeBuiltins = BUILTIN_APPS.filter(function(app) {
        return hiddenBuiltinIds.indexOf(app.id) === -1;
      });
      filesData = activeBuiltins.concat(customFiles);
    }

    function toggleEditMode(forceOff) {
      isEditMode = forceOff === true ? false : !isEditMode;

      if (isEditMode) {
        appsContainer.classList.add("edit-mode");
        editBtn.classList.add("active");
        editBtn.textContent = "Done";
        setStatus("Edit ਮੋਡ ਚਾਲੂ ਹੈ: Cross (×) ਨਾਲ ਪ੍ਰੋਗਰਾਮ ਹਟਾਓ।");
      } else {
        appsContainer.classList.remove("edit-mode");
        editBtn.classList.remove("active");
        editBtn.textContent = "Edit";
        setStatus("Open As App: ਕੁੱਲ " + filesData.length + " ਪ੍ਰੋਗਰਾਮ ਮੌਜੂਦ ਹਨ।");
      }
    }

    editBtn.addEventListener("click", function() {
      if (filesData.length === 0) {
        setStatus("ਹਟਾਉਣ ਲਈ ਕੋਈ ਪ੍ਰੋਗਰਾਮ ਮੌਜੂਦ ਨਹੀਂ ਹੈ।");
        return;
      }
      toggleEditMode();
    });

    function loadSavedData() {
      try {
        const savedCustom = localStorage.getItem(STORAGE_KEY_CUSTOM);
        if (savedCustom) {
          customFiles = JSON.parse(savedCustom) || [];
        }
        const savedHidden = localStorage.getItem(STORAGE_KEY_HIDDEN);
        if (savedHidden) {
          hiddenBuiltinIds = JSON.parse(savedHidden) || [];
        }
      } catch (e) {
        customFiles = [];
        hiddenBuiltinIds = [];
      }
      rebuildFilesList();
      renderButtons();
      setStatus("Open As App ਤਿਆਰ ਹੈ (" + filesData.length + " ਪ੍ਰੋਗਰਾਮ)।");
    }

    function renderButtons() {
      appsContainer.innerHTML = "";

      if (filesData.length === 0) {
        toggleEditMode(true);
        appsContainer.innerHTML = '<div class="empty-msg">ਕੋਈ ਪ੍ਰੋਗਰਾਮ ਮੌਜੂਦ ਨਹੀਂ ਹੈ।<br><b>+ File</b>, <b>+ Folder</b> ਜਾਂ <b>Reset</b> ਦਬਾ ਕੇ ਪ੍ਰੋਗਰਾਮ ਵਾਪਸ ਲਿਆਓ।</div>';
        return;
      }

      filesData.forEach(function(file, index) {
        const row = document.createElement("div");
        row.className = "program-row";

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "program-btn";
        btn.style.backgroundColor = buttonColors[index % buttonColors.length];

        btn.textContent = file.name.replace(/\.html?$/i, "");
        btn.title = file.path || file.name;

        btn.addEventListener("click", function() {
          openProgram(file.id);
        });

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "del-btn";
        delBtn.textContent = "×";
        delBtn.title = "ਪ੍ਰੋਗਰਾਮ ਹਟਾਓ";

        delBtn.addEventListener("click", function() {
          deleteProgram(file.id);
        });

        row.appendChild(btn);
        row.appendChild(delBtn);
        appsContainer.appendChild(row);
      });
    }

    function processSelectedFiles(fileList, sourceLabel) {
      const allFiles = Array.from(fileList);
      if (allFiles.length === 0) return;

      const htmlFiles = allFiles.filter(function(f) {
        const n = f.name.toLowerCase();
        return n.endsWith(".html") || n.endsWith(".htm");
      });

      if (htmlFiles.length === 0) {
        setStatus("ਕੋਈ HTML ਫਾਈਲ ਨਹੀਂ ਮਿਲੀ।");
        return;
      }

      let done = 0;
      htmlFiles.forEach(function(file) {
        const reader = new FileReader();
        reader.onload = function(ev) {
          customFiles.push({
            id: "custom_" + Date.now().toString() + "_" + Math.random().toString(36).slice(2, 7),
            name: file.name,
            path: file.webkitRelativePath || file.name,
            builtin: false,
            content: ev.target.result
          });
          done++;
          if (done === htmlFiles.length) {
            rebuildFilesList();
            renderButtons();
            setStatus(sourceLabel + " ਤੋਂ " + done + " ਪ੍ਰੋਗਰਾਮ ਜੁੜ ਗਏ। ਸੇਵ ਕਰਨ ਲਈ 'Save' ਦਬਾਓ।");
          }
        };
        reader.readAsText(file);
      });
    }

    fileInput.addEventListener("change", function(e) {
      processSelectedFiles(e.target.files, "ਫਾਈਲ");
      fileInput.value = "";
    });

    folderInput.addEventListener("change", function(e) {
      processSelectedFiles(e.target.files, "ਫੋਲਡਰ");
      folderInput.value = "";
    });

    function openProgram(id) {
      const file = filesData.find(function(f) { return f.id === id; });
      if (!file) return;

      viewerTitle.textContent = file.name.replace(/\.html?$/i, "");
      fileFrame.srcdoc = file.content;

      homeScreen.style.display = "none";
      viewerScreen.style.display = "flex";
    }

    function closeProgram() {
      fileFrame.srcdoc = "";
      mobileShell.classList.remove("expanded");
      viewerScreen.style.display = "none";
      homeScreen.style.display = "flex";
    }

    function deleteProgram(id) {
      const target = filesData.find(function(f) { return f.id === id; });
      if (!target) return;

      if (target.builtin) {
        if (hiddenBuiltinIds.indexOf(id) === -1) {
          hiddenBuiltinIds.push(id);
        }
      } else {
        customFiles = customFiles.filter(function(f) { return f.id !== id; });
      }
      rebuildFilesList();
      renderButtons();
      setStatus("ਪ੍ਰੋਗਰਾਮ ਹਟਾ ਦਿੱਤਾ ਗਿਆ। ਪੱਕਾ ਸੇਵ ਕਰਨ ਲਈ 'Save' ਦਬਾਓ।");
    }

    expandBtn.addEventListener("click", function() {
      mobileShell.classList.toggle("expanded");
    });

    closeBtn.addEventListener("click", closeProgram);

    saveBtn.addEventListener("click", function() {
      try {
        localStorage.setItem(STORAGE_KEY_CUSTOM, JSON.stringify(customFiles));
        localStorage.setItem(STORAGE_KEY_HIDDEN, JSON.stringify(hiddenBuiltinIds));
        toggleEditMode(true);
        setStatus("ਸਾਰਾ ਡਾਟਾ ਸੇਵ ਹੋ ਗਿਆ (" + filesData.length + " ਪ੍ਰੋਗਰਾਮ)।");
        alert("ਡਾਟਾ ਸੇਵ ਹੋ ਗਿਆ ਹੈ!");
      } catch (e) {
        setStatus("ਸੇਵ ਨਹੀਂ ਹੋ ਸਕਿਆ: ਨਵੀਆਂ ਫਾਈਲਾਂ ਦਾ ਸਾਈਜ਼ 5MB ਲਿਮਿਟ ਤੋਂ ਵੱਧ ਹੈ।");
        alert("ਨਵੀਆਂ ਫਾਈਲਾਂ ਦਾ ਸਾਈਜ਼ 5MB ਤੋਂ ਵੱਧ ਹੋਣ ਕਰਕੇ ਡਾਟਾ ਸੇਵ ਨਹੀਂ ਹੋ ਸਕਿਆ।");
      }
    });

    // Reset ਬਟਨ (ਪਾਸਵਰਡ 2005 ਨਾਲ ਸੁਰੱਖਿਅਤ) — ਸਾਰੀਆਂ 9 ਡਿਫਾਲਟ ਐਪਾਂ ਵਾਪਸ ਲਿਆਉਂਦਾ ਹੈ
    resetBtn.addEventListener("click", function() {
      const enteredPass = prompt("Reset ਕਰਨ ਲਈ ਪਾਸਵਰਡ ਦਰਜ ਕਰੋ:");
      if (enteredPass === null) return;

      if (enteredPass !== RESET_PASSWORD) {
        alert("ਗਲਤ ਪਾਸਵਰਡ! ਡਾਟਾ Reset ਨਹੀਂ ਕੀਤਾ ਗਿਆ।");
        setStatus("Reset ਰੱਦ: ਗਲਤ ਪਾਸਵਰਡ।");
        return;
      }

      if (!confirm("ਪਾਸਵਰਡ ਸਹੀ ਹੈ। ਕੀ ਤੁਸੀਂ ਸਾਰੀਆਂ ਡਿਫਾਲਟ ਐਪਾਂ ਵਾਪਸ ਲਿਆ ਕੇ ਡਾਟਾ Reset ਕਰਨਾ ਚਾਹੁੰਦੇ ਹੋ?")) {
        return;
      }

      customFiles = [];
      hiddenBuiltinIds = [];
      localStorage.removeItem(STORAGE_KEY_CUSTOM);
      localStorage.removeItem(STORAGE_KEY_HIDDEN);
      fileInput.value = "";
      folderInput.value = "";
      rebuildFilesList();
      toggleEditMode(true);
      closeProgram();
      renderButtons();
      setStatus("ਡਾਟਾ Reset ਹੋ ਗਿਆ — ਸਾਰੀਆਂ " + filesData.length + " ਡਿਫਾਲਟ ਐਪਾਂ ਵਾਪਸ ਆ ਗਈਆਂ ਹਨ।");
    });

    loadSavedData();
  </script>
</body>
</html>
